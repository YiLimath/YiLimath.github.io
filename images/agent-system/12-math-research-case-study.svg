<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 20px Arial;fill:#17283c}.s{font:400 14px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Case Study: Danus + Rethlas</text><text x="80" y="110" class="u">An as-built architecture for long-running, multi-agent mathematical proof search</text><rect x="85" y="350" width="205" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="187" y="393" text-anchor="middle" class="h">Operator</text><text x="187" y="424" text-anchor="middle" class="s">problem · priorities · stop</text><path d="M290 405H405" class="l"/><polygon points="405,405 396,400.5 396,409.5" class="al"/><rect x="405" y="300" width="270" height="210" rx="12" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="540" y="350" text-anchor="middle" class="h">Danus orchestration</text><text x="540" y="388" text-anchor="middle" class="s">main agent + danus CLI</text><text x="540" y="421" text-anchor="middle" class="s">assign · start · monitor · stop</text><text x="540" y="454" text-anchor="middle" class="s">strategy consult → guidance</text><path d="M675 405H780" class="l"/><polygon points="780,405 771,400.5 771,409.5" class="al"/><rect x="780" y="170" width="300" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="930" y="212" text-anchor="middle" class="h">Rethlas proof workers</text><text x="930" y="243" text-anchor="middle" class="s">parallel Codex sessions + skills</text><rect x="780" y="350" width="300" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="930" y="392" text-anchor="middle" class="h">Role-gated gateway</text><text x="930" y="423" text-anchor="middle" class="s">MCP tools · permissions</text><rect x="780" y="530" width="300" height="105" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="930" y="572" text-anchor="middle" class="h">Cold-start verifier</text><text x="930" y="603" text-anchor="middle" class="s">HTTP /verify · strict verdict</text><path d="M675 405H730V222H770" class="l"/><polygon points="770,222 761,217.5 761,226.5" class="al"/><path d="M675 405H770" class="l"/><polygon points="770,405 761,400.5 761,409.5" class="al"/><path d="M675 405H730V582H770" class="l"/><polygon points="770,582 761,577.5 761,586.5" class="al"/><path d="M1080 222H1190V690H187V460" class="d"/><polygon points="187,460 182.5,469 191.5,469" class="ad"/><path d="M1080 402H1190" class="r"/><polygon points="1190,402 1181,397.5 1181,406.5" class="ar"/><path d="M1080 582H1190" class="r"/><polygon points="1190,582 1181,577.5 1181,586.5" class="ar"/><rect x="405" y="650" width="270" height="95" rx="10" fill="#fff" stroke="#23364d" class="b"/><text x="540" y="690" text-anchor="middle" class="h">Truth layer</text><text x="540" y="721" text-anchor="middle" class="s">local/global memory + fact graph</text><path d="M540 650V510" class="d"/><polygon points="540,510 535.5,519 544.5,519" class="ad"/><rect x="1230" y="300" width="280" height="125" rx="12" fill="#fffdf5" stroke="#d98c2b" class="b"/><text x="1370" y="343" text-anchor="middle" class="h">Outputs</text><text x="1370" y="375" text-anchor="middle" class="s">isolated write-paper agent</text><text x="1370" y="402" text-anchor="middle" class="s">isolated human-summary agent</text><path d="M1080 222H1160V362H1220" class="l"/><polygon points="1220,362 1211,357.5 1211,366.5" class="al"/><path d="M1080 582H1160V362H1220" class="l"/><polygon points="1220,362 1211,357.5 1211,366.5" class="al"/><rect x="1230" y="500" width="280" height="125" rx="12" fill="#fff" stroke="#9eb0c2" class="b"/><text x="1370" y="543" text-anchor="middle" class="h">Cross-cutting</text><text x="1370" y="575" text-anchor="middle" class="s">observability · theorem search</text><text x="1370" y="602" text-anchor="middle" class="s">runtime · services · recovery</text><path d="M1080 582H1160V562H1220" class="d"/><polygon points="1220,562 1211,557.5 1211,566.5" class="ad"/><text x="800" y="780" text-anchor="middle" class="s">Danus extends the Rethlas generation–verification core with orchestration, memory, truth gates, and production controls.</text><rect x="350" y="810" width="900" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="839" text-anchor="middle" class="s">A fact enters the truth layer only after the verifier accepts it.</text></svg>
