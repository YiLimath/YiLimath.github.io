<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 20px Arial;fill:#17283c}.s{font:400 14px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}.r{stroke:#c65b5b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Case Study: Danus + Rethlas</text><text x="80" y="110" class="u">An as-built architecture for long-running, multi-agent mathematical proof search</text><rect x="85" y="350" width="205" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="187" y="393" text-anchor="middle" class="h">Operator</text><text x="187" y="424" text-anchor="middle" class="s">problem · priorities · stop</text><path d="M290 405H405" class="l"/><rect x="405" y="300" width="270" height="210" rx="12" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="540" y="350" text-anchor="middle" class="h">Danus orchestration</text><text x="540" y="388" text-anchor="middle" class="s">main agent + danus CLI</text><text x="540" y="421" text-anchor="middle" class="s">assign · start · monitor · stop</text><text x="540" y="454" text-anchor="middle" class="s">strategy consult → guidance</text><path d="M675 405H780" class="l"/><rect x="780" y="170" width="300" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="930" y="212" text-anchor="middle" class="h">Rethlas proof workers</text><text x="930" y="243" text-anchor="middle" class="s">parallel Codex sessions + skills</text><rect x="780" y="350" width="300" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="930" y="392" text-anchor="middle" class="h">Role-gated gateway</text><text x="930" y="423" text-anchor="middle" class="s">MCP tools · permissions</text><rect x="780" y="530" width="300" height="105" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="930" y="572" text-anchor="middle" class="h">Cold-start verifier</text><text x="930" y="603" text-anchor="middle" class="s">HTTP /verify · strict verdict</text><path d="M675 405H730V222H770M675 405H770M675 405H730V582H770" class="l"/><path d="M1080 222H1190V690H187V460" class="d"/><path d="M1080 402H1190M1080 582H1190" class="r"/><rect x="405" y="650" width="270" height="95" rx="10" fill="#fff" stroke="#23364d" class="b"/><text x="540" y="690" text-anchor="middle" class="h">Truth layer</text><text x="540" y="721" text-anchor="middle" class="s">local/global memory + fact graph</text><path d="M540 650V510" class="d"/><rect x="1230" y="300" width="280" height="125" rx="12" fill="#fffdf5" stroke="#d98c2b" class="b"/><text x="1370" y="343" text-anchor="middle" class="h">Outputs</text><text x="1370" y="375" text-anchor="middle" class="s">isolated write-paper agent</text><text x="1370" y="402" text-anchor="middle" class="s">isolated human-summary agent</text><path d="M1080 222H1160V362H1220M1080 582H1160V362H1220" class="l"/><rect x="1230" y="500" width="280" height="125" rx="12" fill="#fff" stroke="#9eb0c2" class="b"/><text x="1370" y="543" text-anchor="middle" class="h">Cross-cutting</text><text x="1370" y="575" text-anchor="middle" class="s">observability · theorem search</text><text x="1370" y="602" text-anchor="middle" class="s">runtime · services · recovery</text><path d="M1080 582H1160V562H1220" class="d"/><text x="800" y="780" text-anchor="middle" class="s">Danus extends the Rethlas generation–verification core with orchestration, memory, truth gates, and production controls.</text><rect x="350" y="810" width="900" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="839" text-anchor="middle" clas