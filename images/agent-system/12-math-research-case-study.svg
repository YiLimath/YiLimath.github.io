<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#17283c}.subtitle{font:400 18px Arial,sans-serif;fill:#5b6b7c}
    .label{font:700 20px Arial,sans-serif;fill:#17283c}.body{font:400 15px Arial,sans-serif;fill:#405268}.small{font:400 13px Arial,sans-serif;fill:#5b6b7c}
    .scope{fill:#fbfcfe;stroke:#9eb0c2;stroke-width:2.5;stroke-dasharray:10 8}.box{stroke-width:2.5}.navy{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.teal{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}.red{stroke:#c65b5b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.orange{stroke:#d98c2b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .ah-navy{fill:#23364d}.ah-teal{fill:#219487}.ah-red{fill:#c65b5b}.ah-orange{fill:#d98c2b}
  </style>
</defs>

<rect width="1600" height="1000" fill="#f7f9fc"/>
<text x="60" y="68" class="title">Danus + Rethlas — As-Built Architecture</text>
<text x="60" y="103" class="subtitle">Danus adds orchestration and truth controls around the inherited Rethlas proof core</text>

<!-- Scope -->
<rect x="255" y="145" width="1085" height="780" rx="22" class="scope"/>
<rect x="280" y="132" width="300" height="30" rx="15" fill="#f7f9fc"/>
<text x="295" y="153" class="small" style="font-weight:700;letter-spacing:1px">DANUS SYSTEM BOUNDARY</text>

<!-- External operator -->
<rect x="35" y="220" width="185" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="box"/>
<text x="127" y="262" text-anchor="middle" class="label">Operator</text>
<text x="127" y="292" text-anchor="middle" class="body">problem · priorities</text>
<text x="127" y="314" text-anchor="middle" class="body">stop / resume</text>
<path d="M220 272H330" class="navy"/>
<polygon points="330,272 319,266.5 319,277.5" class="ah-navy"/>
<text x="274" y="258" text-anchor="middle" class="small">commands</text>

<!-- Control plane -->
<rect x="330" y="205" width="300" height="115" rx="12" fill="#fff4e8" stroke="#d98c2b" class="box"/>
<text x="480" y="247" text-anchor="middle" class="label">Orchestration</text>
<text x="480" y="276" text-anchor="middle" class="body">main agent + danus CLI</text>
<text x="480" y="298" text-anchor="middle" class="body">assign · start · monitor · stop</text>

<rect x="780" y="205" width="300" height="115" rx="12" fill="#e9f5f1" stroke="#219487" class="box"/>
<text x="930" y="247" text-anchor="middle" class="label">Strategy consult</text>
<text x="930" y="276" text-anchor="middle" class="body">elaboration → consultation</text>
<text x="930" y="298" text-anchor="middle" class="body">next master_guidance</text>
<path d="M630 262H780" class="navy"/>
<polygon points="780,262 769,256.5 769,267.5" class="ah-navy"/>
<text x="705" y="248" text-anchor="middle" class="small">elaboration</text>

<!-- Execution plane -->
<rect x="500" y="390" width="560" height="145" rx="14" fill="#eef7f5" stroke="#219487" class="box"/>
<text x="780" y="427" text-anchor="middle" class="label">Worker swarm</text>
<text x="780" y="453" text-anchor="middle" class="body">detached, resumable rounds · parallel exploration</text>
<rect x="530" y="475" width="500" height="42" rx="9" fill="#ffffff" stroke="#72b9ae" stroke-width="2" stroke-dasharray="7 6"/>
<text x="780" y="502" text-anchor="middle" class="body">Rethlas proof core: Codex + proving skills</text>

<path d="M480 320V350H630V390" class="navy"/>
<polygon points="630,390 624.5,379 635.5,379" class="ah-navy"/>
<text x="548" y="344" text-anchor="middle" class="small">TASK.md / round</text>
<path d="M930 320V390" class="teal"/>
<polygon points="930,390 924.5,379 935.5,379" class="ah-teal"/>
<text x="950" y="357" class="small">master_guidance</text>

<!-- Verification and truth plane -->
<rect x="330" y="590" width="300" height="125" rx="12" fill="#f0ebfb" stroke="#7863b6" class="box"/>
<text x="480" y="632" text-anchor="middle" class="label">Role-gated MCP gateway</text>
<text x="480" y="661" text-anchor="middle" class="body">worker: fact_submit</text>
<text x="480" y="683" text-anchor="middle" class="body">main: no submit · verifier: read-only</text>

<rect x="730" y="590" width="300" height="125" rx="12" fill="#fceceb" stroke="#c65b5b" class="box"/>
<text x="880" y="632" text-anchor="middle" class="label">Cold-start verifier</text>
<text x="880" y="661" text-anchor="middle" class="body">HTTP /verify · fresh Codex judge</text>
<text x="880" y="683" text-anchor="middle" class="body">correct ⇔ no errors and no gaps</text>

<rect x="1160" y="555" width="160" height="82" rx="11" fill="#fff2f0" stroke="#c65b5b" class="box"/>
<text x="1240" y="587" text-anchor="middle" class="label" style="font-size:18px">Fact graph</text>
<text x="1240" y="614" text-anchor="middle" class="body">write if correct</text>

<rect x="1160" y="665" width="160" height="82" rx="11" fill="#edf7f5" stroke="#72b9ae" class="box"/>
<text x="1240" y="697" text-anchor="middle" class="label" style="font-size:18px">Memory tiers</text>
<text x="1240" y="724" text-anchor="middle" class="body">local · global · trace</text>

<path d="M590 535V570H480V590" class="navy"/>
<polygon points="480,590 474.5,579 485.5,579" class="ah-navy"/>
<text x="515" y="566" class="small">fact_submit</text>
<path d="M630 625H730" class="navy"/>
<polygon points="730,625 719,619.5 719,630.5" class="ah-navy"/>
<text x="680" y="611" text-anchor="middle" class="small">POST /verify</text>
<path d="M730 690H630" class="teal"/>
<polygon points="630,690 641,684.5 641,695.5" class="ah-teal"/>
<text x="680" y="678" text-anchor="middle" class="small">verdict + repair_hints</text>

<!-- Verification-gated writes -->
<path d="M1030 625H1060" class="teal"/>
<polygon points="1060,625 1049,619.5 1049,630.5" class="ah-teal"/>
<polygon points="1060,625 1100,590 1140,625 1100,660" fill="#fff8e8" stroke="#d98c2b" class="box"/>
<text x="1100" y="630" text-anchor="middle" class="small" style="font-weight:700">correct?</text>
<path d="M1140 625H1160" class="red"/>
<polygon points="1160,625 1149,619.5 1149,630.5" class="ah-red"/>
<text x="1150" y="650" text-anchor="middle" class="small" style="font-weight:700;fill:#c65b5b">yes</text>
<path d="M480 715V770H1130V706H1160" class="teal"/>
<polygon points="1160,706 1149,700.5 1149,711.5" class="ah-teal"/>
<text x="820" y="758" text-anchor="middle" class="small">gm_* reads / verification trace</text>

<!-- Output plane -->
<rect x="440" y="805" width="620" height="82" rx="12" fill="#fffdf5" stroke="#d98c2b" class="box"/>
<text x="750" y="838" text-anchor="middle" class="label">Isolated authoring agents</text>
<text x="750" y="866" text-anchor="middle" class="body">write-paper (publication) · human-summary (progress report)</text>
<path d="M1160 625H1130V775H1060V805" class="teal"/>
<polygon points="1060,805 1054.5,794 1065.5,794" class="ah-teal"/>
<text x="1190" y="766" text-anchor="middle" class="small">verified facts / reports</text>

<!-- Cross-cutting services -->
<rect x="330" y="905" width="990" height="45" rx="9" fill="#ffffff" stroke="#c4ced8" stroke-width="2"/>
<text x="825" y="933" text-anchor="middle" class="body">Cross-cutting: observability · theorem search · runtime · service recovery</text>

<!-- Legend -->
<path d="M1380 235H1450" class="navy"/><polygon points="1450,235 1439,229.5 1439,240.5" class="ah-navy"/>
<text x="1465" y="240" class="small">command / control</text>
<path d="M1380 275H1450" class="teal"/><polygon points="1450,275 1439,269.5 1439,280.5" class="ah-teal"/>
<text x="1465" y="280" class="small">data / feedback</text>
<path d="M1380 315H1450" class="red"/><polygon points="1450,315 1439,309.5 1439,320.5" class="ah-red"/>
<text x="1465" y="320" class="small">correctness gate</text>

<rect x="35" y="760" width="185" height="105" rx="10" fill="#fff" stroke="#c4ced8" stroke-width="2"/>
<text x="127" y="794" text-anchor="middle" class="small" style="font-weight:700">Reading key</text>
<text x="127" y="820" text-anchor="middle" class="small">Rethlas is the</text>
<text x="127" y="840" text-anchor="middle" class="small">inherited proof core;</text>
<text x="127" y="860" text-anchor="middle" class="small">Danus supplies control.</text>
</svg>
