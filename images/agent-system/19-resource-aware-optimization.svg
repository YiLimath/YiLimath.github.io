<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Resource-Aware Optimization</text><text x="80" y="110" class="u">Spend computation where it changes the research decision</text><rect x="110" y="350" width="245" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="232" y="395" text-anchor="middle" class="h">Research task</text><text x="232" y="427" text-anchor="middle" class="s">quality target + budget</text><path d="M355 405H520" class="l"/><rect x="520" y="350" width="270" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="655" y="395" text-anchor="middle" class="h">Policy</text><text x="655" y="427" text-anchor="middle" class="s">route by value and cost</text><path d="M790 405H910" class="l"/><rect x="910" y="190" width="270" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="1045" y="233" text-anchor="middle" class="h">Cheap first</text><text x="1045" y="263" text-anchor="middle" class="s">cache · local search · SLM</text><rect x="910" y="350" width="270" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1045" y="393" text-anchor="middle" class="h">Targeted expensive</text><text x="1045" y="423" text-anchor="middle" class="s">deep reasoning · broad search</text><rect x="910" y="510" width="270" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1045" y="553" text-anchor="middle" class="h">Stop or defer</text><text x="1045" y="583" text-anchor="middle" class="s">budget or low value</text><path d="M790 405H850V240H900M790 405H900M790 405H850V560H900" class="l"/><path d="M1180 240H1290V690H232V460" class="d"/><path d="M1180 400H1290M1180 560H1290" class="d"/><text x="800" y="735" text-anchor="middle" class="s">Optimization is multi-objective: quality, latency, cost, reliability, and reproducibility.</text><rect x="400" y="765" width="800" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Do not optimize away the evidence needed to audit a mathematical claim.</text></svg>
