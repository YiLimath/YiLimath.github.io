<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">C / Transfer properties, not just objects</title><desc id="desc">A blow-up preserves pluricanonical sections in this setting, but can destroy nefness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#357477"/></marker></defs><rect width="1120" height="680" rx="20" fill="#f4f7fa"/>
<text x="40" y="49" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#19364b">C / Transfer properties, not just objects</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">A blow-up preserves pluricanonical sections in this setting, but can destroy nefness.</text>
<rect x="40" y="120" width="290" height="125" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Original model X</text>
<text x="58" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Smooth projective surface</text>
<text x="58" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Specified property and target</text>
<rect x="415" y="120" width="290" height="125" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="433" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Blow-up π : Y → X</text>
<text x="433" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Exceptional curve E</text>
<text x="433" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">K_Y = π^*K_X + E</text>
<polyline points="330,182 415,182" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="40" y="345" width="290" height="125" rx="12" fill="#e7f2f2" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="376" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Positive transfer</text>
<text x="58" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Pushforward of O_Y(mE) = O_X</text>
<text x="58" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Projection formula; compare H⁰</text>
<rect x="415" y="345" width="290" height="125" rx="12" fill="#fff3e4" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="433" y="376" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Failed transfer</text>
<text x="433" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">K_Y · E = −1</text>
<text x="433" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Nefness does not survive</text>
<rect x="790" y="345" width="290" height="125" rx="12" fill="#e9eef9" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="808" y="376" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Theorem interface</text>
<text x="808" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Record exactly what transfers</text>
<text x="808" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Audit every induction call</text>
<polyline points="490,245 490,290 185,290 185,345" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="630,245 630,345" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="185,470 185,530 935,530 935,470" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="705,408 790,408" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="790" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#19364b">Decision boundary</text>
<text x="790" y="197" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Evidence precedes admission.</text>
<text x="790" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Failures remain part of the record.</text>
<path d="M40 596 H1080" stroke="#cbd8df"/>
<text x="40" y="624" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#19364b">Read each arrow as an obligation to supply evidence.</text>
<text x="40" y="652" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#19364b">Induction audit: every dependency must lower a declared well-founded rank; base cases are separate.</text>
</svg>