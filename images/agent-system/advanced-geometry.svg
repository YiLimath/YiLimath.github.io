<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Coordinate changes / Preserve the missing cases</title><desc id="desc">F(u,v) = (u,uv): the inverse formula is only one branch of the decision.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#357477"/></marker></defs><rect width="1120" height="680" rx="20" fill="#f4f7fa"/>
<text x="40" y="49" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#19364b">Coordinate changes / Preserve the missing cases</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">F(u,v) = (u,uv): the inverse formula is only one branch of the decision.</text>
<rect x="40" y="120" width="300" height="100" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Freeze the requested output</text>
<text x="58" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Target (x,y), over the reals</text>
<text x="58" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Record existence AND uniqueness</text>
<rect x="410" y="120" width="300" height="100" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="428" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Partition the domain</text>
<text x="428" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">x ≠ 0</text>
<text x="428" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">x = 0: inspect y separately</text>
<polyline points="340,170 410,170" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="300" height="135" rx="12" fill="#e7f2f2" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="361" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">x ≠ 0: unique preimage</text>
<text x="58" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">(u,v) = (x,y/x)</text>
<text x="58" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Check u = x and uv = y</text>
<text x="58" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Division is justified here</text>
<rect x="410" y="330" width="300" height="135" rx="12" fill="#e9eef9" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="428" y="361" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">(x,y) = (0,0): many</text>
<text x="428" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Every (0,v) maps to the origin</text>
<text x="428" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Existence survives</text>
<text x="428" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Uniqueness does not</text>
<rect x="780" y="330" width="300" height="135" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="798" y="361" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">x = 0, y ≠ 0: none</text>
<text x="798" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">u = 0 forces uv = 0</text>
<text x="798" y="415" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Contradicts requested y ≠ 0</text>
<text x="798" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Keep the impossibility proof</text>
<polyline points="460,220 460,270 190,270 190,330" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="560,220 560,330" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="660,220 660,270 930,270 930,330" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="40" y="530" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Admission record: target version + case + witness or contradiction + checked assumptions</text>
<path d="M40 596 H1080" stroke="#cbd8df"/>
<text x="40" y="624" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#19364b">Transfer test: a curve parametrization needs coverage of the excluded x = 0 case.</text>
<text x="40" y="652" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#19364b">Canceling u² changes the transformed solution set; prove what still returns to the original target.</text>
</svg>