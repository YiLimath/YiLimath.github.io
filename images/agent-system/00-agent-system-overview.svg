<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23364d"/></marker><style>
