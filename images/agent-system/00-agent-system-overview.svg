<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}
.title{font:700 34px Arial,sans-serif;fill:#17283c}.sub{font:400 18px Arial,sans-serif;fill:#5b6b7c}.h{font:700 22px Arial,sans-serif;fill:#17283c}.t{font:600 18px Arial,sans-serif;fill:#17283c}.s{font:400 16px Arial,sans-serif;fill:#405268}.box{fill:#fff;stroke:#9eb0c2;stroke-width:2}.line{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:butt;stroke-linejoin:miter}.dash{stroke:#70859a;stroke-width:2.5;stroke-dasharray:9 8;fill:none;stroke-linecap:butt;stroke-linejoin:miter}
</style></defs>
<rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Agent System: Core Control Loop</text><text x="80" y="110" class="sub">A reusable architecture for trading determinism for flexibility</text>
