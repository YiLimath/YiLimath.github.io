<rect x="365" y="180" width="250" height="100" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="490" y="220" text-anchor="middle" class="h">Perception</text><text x="490" y="251" text-anchor="middle" class="s">observe · filter · interpret</text>
