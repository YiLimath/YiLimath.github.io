<rect x="1035" y="180" width="250" height="100" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1160" y="220" text-anchor="middle" class="h">Action</text><text x="1160" y="251" text-anchor="middle" class="s">use tools · interact · modify</text>
<rect x="1370" y="180" width="170" height="100" rx="10" class="box"/><text x="1455" y="220" text-anchor="middle" class="h">Outcome</text><text x="1455" y="251" text-anchor="middle" class="s">new state</text>
