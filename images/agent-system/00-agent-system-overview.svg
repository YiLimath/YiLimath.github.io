<rect x="365" y="570" width="250" height="100" rx="10" fill="#eef5ff" stroke="#3985c6" stroke-width="2"/><text x="490" y="610" text-anchor="middle" class="h">Memory</text><text x="490" y="641" text-anchor="middle" class="s">store · retrieve · update</text>
