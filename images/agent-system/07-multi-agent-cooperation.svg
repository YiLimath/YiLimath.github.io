<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23364d"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#7355aa;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Multiple-Agent Cooperation Pattern</text><text x="80" y="110" class="sub">Assign distinct responsibilities and coordinate through explicit messages</text><rect x="680" y="165" width="240" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="800" y="208" text-anchor="middle" class="h">Coordinator</text><text x="800" y="239" text-anchor="middle" class="s">decompose · delegate · merge</text><rect x="170" y="380" width="250" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="295" y="425" text-anchor="middle" class="h">Research agent</text><text x="295" y="456" text-anchor="middle" class="s">find evidence</text><rect x="675" y="380" width="250" height="110" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="800" y="425" text-anchor="middle" class="h">Reasoning agent</text><text x="800" y="456" text-anchor="middle" class="s">construct argument</text><rect x="1180" y="380" width="250" height="110" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1305" y="425" text-anchor="middle" class="h">Writing agent</text><text x="1305" y="456" text-anchor="middle" class="s">format response</text><path d="M760 270 V330 H295 V370" class="l"/><path d="M800 270 V370" class="l"/><path d="M840 270 V330 H1305 V370" class="l"/><path d="M295 490 V600 H800 V280" class="d"/><path d="M800 490 V600" class="d"/><path d="M1305 490 V600 H800" class="d"/><rect x="680" y="600" width="240" height="105" rx="10" class="b"/><text x="800" y="643" text-anchor="middle" class="h">Shared result</text><text x="800" y="674" text-anchor="middle" class="s">coherent answer</text><path d="M800 705 V760" class="l"/><text x="800" y="815" text-anchor="middle" class="s">Coordination is the pattern; specialization is the implementation choice.</text></svg>
