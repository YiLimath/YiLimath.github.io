<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
<style>
.title{font:700 34px Arial,sans-serif;fill:#17283c}.sub{font:400 18px Arial,sans-serif;fill:#5b6b7c}
.h{font:700 22px Arial,sans-serif;fill:#17283c}.s{font:400 16px Arial,sans-serif;fill:#405268}
.small{font:400 14px Arial,sans-serif;fill:#5b6b7c}.node{stroke-width:2.5}.main{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.msg{stroke:#7355aa;stroke-width:3;stroke-dasharray:3 8;fill:none;stroke-linecap:round;stroke-linejoin:round}.navy{fill:#23364d}.violet{fill:#7355aa}
</style>
</defs>
<rect width="1600" height="1000" fill="#f7f9fc"/>
<text x="80" y="75" class="title">Multiple-Agent Cooperation Pattern</text>
<text x="80" y="110" class="sub">A coordinator delegates typed subtasks; specialists contribute through a shared message contract</text>

<rect x="680" y="150" width="240" height="105" rx="12" fill="#fff4e8" stroke="#d98c2b" class="node"/>
<text x="800" y="194" text-anchor="middle" class="h">Coordinator</text>
<text x="800" y="225" text-anchor="middle" class="s">decompose · delegate · merge</text>

<rect x="170" y="355" width="250" height="115" rx="12" fill="#e6f1fb" stroke="#3985c6" class="node"/>
<text x="295" y="402" text-anchor="middle" class="h">Agent A</text>
<text x="295" y="434" text-anchor="middle" class="s">independent specialist</text>
<rect x="675" y="355" width="250" height="115" rx="12" fill="#eee8fb" stroke="#7355aa" class="node"/>
<text x="800" y="402" text-anchor="middle" class="h">Agent B</text>
<text x="800" y="434" text-anchor="middle" class="s">independent specialist</text>
<rect x="1180" y="355" width="250" height="115" rx="12" fill="#e6f4f1" stroke="#219487" class="node"/>
<text x="1305" y="402" text-anchor="middle" class="h">Agent C</text>
<text x="1305" y="434" text-anchor="middle" class="s">independent specialist</text>

<!-- Delegation fan-out; each branch terminates at a distinct agent -->
<path d="M760 255 V305 H295 V355" class="main"/>
<polygon points="295,355 289.5,345 300.5,345" class="navy"/>
<path d="M800 255 V355" class="main"/>
<polygon points="800,355 794.5,345 805.5,345" class="navy"/>
<path d="M840 255 V305 H1305 V355" class="main"/>
<polygon points="1305,355 1299.5,345 1310.5,345" class="navy"/>
<text x="520" y="291" text-anchor="middle" class="small">typed subtask</text>
<text x="1080" y="291" text-anchor="middle" class="small">typed subtask</text>

<!-- Shared protocol is an explicit participant, so result arrows do not cross one another -->
<rect x="240" y="570" width="1120" height="92" rx="12" fill="#ffffff" stroke="#8fa6bd" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="800" y="607" text-anchor="middle" class="h">Shared message protocol</text>
<text x="800" y="636" text-anchor="middle" class="s">correlation id · artifact · evidence · status · completion signal</text>
<path d="M295 470 V570" class="msg"/>
<polygon points="295,570 289.5,560 300.5,560" class="violet"/>
<path d="M800 470 V570" class="msg"/>
<polygon points="800,570 794.5,560 805.5,560" class="violet"/>
<path d="M1305 470 V570" class="msg"/>
<polygon points="1305,570 1299.5,560 1310.5,560" class="violet"/>
<text x="205" y="530" class="small">return artifact</text>
<text x="1360" y="530" text-anchor="end" class="small">return artifact</text>

<rect x="680" y="735" width="240" height="105" rx="12" fill="#e5f4f1" stroke="#219487" class="node"/>
<text x="800" y="779" text-anchor="middle" class="h">Shared result</text>
<text x="800" y="810" text-anchor="middle" class="s">coherent, checked answer</text>
<path d="M800 662 V735" class="main"/>
<polygon points="800,735 794.5,725 805.5,725" class="navy"/>
<text x="850" y="705" class="small">aggregate and verify</text>

<rect x="270" y="890" width="1060" height="42" rx="9" fill="#f1f4f8" stroke="#d7e0e9"/>
<path d="M300 911 H355" class="main"/><polygon points="355,911 345,905.5 345,916.5" class="navy"/><text x="370" y="917" class="small">delegation / execution</text>
<path d="M660 911 H715" class="msg"/><polygon points="715,911 705,905.5 705,916.5" class="violet"/><text x="730" y="917" class="small">artifact / status message</text>
<text x="800" y="970" text-anchor="middle" class="sub">The pattern is coordination through contracts, not merely placing several agents in one diagram.</text>
</svg>
