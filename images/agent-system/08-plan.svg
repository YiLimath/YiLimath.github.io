<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#d98c2b;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Plan Pattern</text><text x="80" y="110" class="sub">Turn a long-horizon goal into executable steps with checkpoints</text><rect x="110" y="370" width="210" height="105" rx="10" class="b"/><text x="215" y="413" text-anchor="middle" class="h">Goal</text><text x="215" y="444" text-anchor="middle" class="s">desired outcome</text><path d="M320 422 H455" class="l"/><rect x="455" y="370" width="235" height="105" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="572" y="413" text-anchor="middle" class="h">Planner</text><text x="572" y="444" text-anchor="middle" class="s">sequence / dependencies</text><path d="M690 422 H800" class="l"/><rect x="800" y="235" width="220" height="95" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="910" y="275" text-anchor="middle" class="h">Step 1</text><text x="910" y="305" text-anchor="middle" class="s">prepare</text><rect x="800" y="375" width="220" height="95" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="910" y="415" text-anchor="middle" class="h">Step 2</text><text x="910" y="445" text-anchor="middle" class="s">execute</text><rect x="800" y="515" width="220" height="95" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="910" y="555" text-anchor="middle" class="h">Step 3</text><text x="910" y="585" text-anchor="middle" class="s">integrate</text><path d="M800 422 H750 V282 H790" class="l"/><path d="M910 330 V365" class="l"/><path d="M910 470 V505" class="l"/><path d="M1020 562 H1130" class="l"/><rect x="1130" y="515" width="250" height="95" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="1255" y="555" text-anchor="middle" class="h">Verify</text><text x="1255" y="585" text-anchor="middle" class="s">checkpoint</text><path d="M1255 515 V190 H572 V370" class="d"/><text x="920" y="170" text-anchor="middle" class="s">revise plan if evidence changes</text><rect x="300" y="745" width="1000" height="60" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="783" text-anchor="middle" class="s">A plan is a hypothesis about execution, updated by checkpoints.</text></svg>
