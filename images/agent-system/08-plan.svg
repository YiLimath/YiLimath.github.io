<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
.title{font:700 36px Arial,Helvetica,sans-serif;fill:#17283c}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#5b6b7c}.h{font:700 20px Arial,Helvetica,sans-serif;fill:#17283c}.s{font:400 16px Arial,Helvetica,sans-serif;fill:#405268}.k{font:700 15px Arial,Helvetica,sans-serif;fill:#5b6b7c}.label{font:400 14px Arial,Helvetica,sans-serif;fill:#5b6b7c}.flow{fill:none;stroke:#28445f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.feedback{fill:none;stroke:#c98425;stroke-width:3;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}.head{fill:#28445f;stroke:none}.fhead{fill:#c98425;stroke:none}.boundary{fill:#fbfcfe;stroke:#9eb0c2;stroke-width:2;stroke-dasharray:10 8}.goal{fill:#eaf3fb;stroke:#4f8fbd;stroke-width:2.5}.planner{fill:#fff5e6;stroke:#c98425;stroke-width:2.5}.artifact{fill:#f4f7fa;stroke:#6e859b;stroke-width:2.5}.executor{fill:#eef8f5;stroke:#2d9180;stroke-width:2.5}.check{fill:#fff5e6;stroke:#c98425;stroke-width:2.5}.result{fill:#f7f8fa;stroke:#405268;stroke-width:2.5}.note{fill:#fff;stroke:#c4ced8;stroke-width:1.5}
</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="80" y="75" class="title">Plan-and-Execute Pattern — Abstract Structure</text><text x="80" y="112" class="sub">Construct a plan, execute bounded steps, and replan when a checkpoint invalidates the hypothesis.</text>
<rect x="60" y="175" width="1480" height="485" rx="6" class="boundary"/><text x="90" y="212" class="k">PLAN-BASED CONTROL LOOP</text>
<rect x="80" y="350" width="200" height="110" rx="5" class="goal"/><text x="180" y="395" text-anchor="middle" class="h">Goal</text><text x="180" y="426" text-anchor="middle" class="s">objective + constraints</text>
<path d="M280 405 H340" class="flow"/><polygon points="340,405 331,400.5 331,409.5" class="head"/>
<rect x="340" y="350" width="200" height="110" rx="5" class="planner"/><text x="440" y="395" text-anchor="middle" class="h">Planner</text><text x="440" y="426" text-anchor="middle" class="s">steps + dependencies</text>
<path d="M540 405 H600" class="flow"/><polygon points="600,405 591,400.5 591,409.5" class="head"/>
<rect x="600" y="350" width="200" height="110" rx="5" class="artifact"/><text x="700" y="395" text-anchor="middle" class="h">Plan</text><text x="700" y="426" text-anchor="middle" class="s">executable artifacts</text>
<path d="M800 405 H860" class="flow"/><polygon points="860,405 851,400.5 851,409.5" class="head"/>
<rect x="860" y="350" width="200" height="110" rx="5" class="executor"/><text x="960" y="395" text-anchor="middle" class="h">Executor</text><text x="960" y="426" text-anchor="middle" class="s">one bounded step</text>
<path d="M1060 405 H1120" class="flow"/><polygon points="1120,405 1111,400.5 1111,409.5" class="head"/>
<rect x="1120" y="350" width="200" height="110" rx="5" class="artifact"/><text x="1220" y="395" text-anchor="middle" class="h">Step result</text><text x="1220" y="426" text-anchor="middle" class="s">artifact + status</text>
<path d="M1320 405 H1350" class="flow"/><polygon points="1350,405 1341,400.5 1341,409.5" class="head"/>
<polygon points="1425,330 1500,405 1425,480 1350,405" class="check"/><text x="1425" y="397" text-anchor="middle" class="h">Checkpoint</text><text x="1425" y="425" text-anchor="middle" class="s">valid?</text>
<path d="M1425 480 V570" class="flow"/><polygon points="1425,570 1420.5,561 1429.5,561" class="head"/><text x="1440" y="525" class="label">done</text><rect x="1300" y="570" width="250" height="95" rx="5" class="result"/><text x="1425" y="610" text-anchor="middle" class="h">Result</text><text x="1425" y="640" text-anchor="middle" class="s">accepted outcome</text>
<path d="M1425 330 V240 H440 V350" class="feedback"/><polygon points="440,350 435.5,341 444.5,341" class="fhead"/><text x="920" y="228" text-anchor="middle" class="label">revise plan when evidence changes</text>
<rect x="80" y="725" width="690" height="90" rx="5" class="note"/><text x="105" y="757" class="k">NOTATION</text><text x="105" y="786" class="s">Solid arrow = execution flow · dashed arrow = replanning feedback</text><text x="105" y="808" class="s">Boxes = artifacts or roles · diamond = checkpoint decision</text><rect x="810" y="725" width="740" height="90" rx="5" class="note"/><text x="835" y="757" class="k">PATTERN INVARIANT</text><text x="835" y="786" class="s">A plan is an executable hypothesis, not evidence of progress.</text><text x="835" y="808" class="s">Only checked step results may advance the loop.</text>
</svg>
