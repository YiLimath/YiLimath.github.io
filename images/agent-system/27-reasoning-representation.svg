<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
.title{font:700 36px Arial,Helvetica,sans-serif;fill:#17283c}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#5b6b7c}.h{font:700 20px Arial,Helvetica,sans-serif;fill:#17283c}.s{font:400 16px Arial,Helvetica,sans-serif;fill:#405268}.k{font:700 15px Arial,Helvetica,sans-serif;fill:#5b6b7c}.label{font:400 14px Arial,Helvetica,sans-serif;fill:#5b6b7c}.flow{fill:none;stroke:#28445f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.feedback{fill:none;stroke:#2d9180;stroke-width:3;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}.head{fill:#28445f;stroke:none}.fhead{fill:#2d9180;stroke:none}.boundary{fill:#fbfcfe;stroke:#9eb0c2;stroke-width:2;stroke-dasharray:10 8}.state{fill:#eaf3fb;stroke:#4f8fbd;stroke-width:2.5}.operation{fill:#fff5e6;stroke:#c98425;stroke-width:2.5}.artifact{fill:#f4f7fa;stroke:#6e859b;stroke-width:2.5}.check{fill:#eef8f5;stroke:#2d9180;stroke-width:2.5}.note{fill:#fff;stroke:#c4ced8;stroke-width:1.5}
</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="80" y="75" class="title">Reasoning Pattern — Representation Change</text><text x="80" y="112" class="sub">Change the representation when the current one hides the next useful inference.</text>
<rect x="60" y="180" width="1480" height="485" rx="6" class="boundary"/><text x="90" y="217" class="k">REPRESENTATION AND INFERENCE CYCLE</text>
<rect x="80" y="330" width="205" height="120" rx="5" class="state"/><text x="182.5" y="378" text-anchor="middle" class="h">Problem state</text><text x="182.5" y="410" text-anchor="middle" class="s">constraints · context</text><path d="M285 390 H325" class="flow"/><polygon points="325,390 316,385.5 316,394.5" class="head"/>
<rect x="325" y="330" width="205" height="120" rx="5" class="artifact"/><text x="427.5" y="378" text-anchor="middle" class="h">Representation A</text><text x="427.5" y="410" text-anchor="middle" class="s">current view</text><path d="M530 390 H570" class="flow"/><polygon points="570,390 561,385.5 561,394.5" class="head"/>
<polygon points="672.5,305 775,390 672.5,475 570,390" class="operation"/><text x="672.5" y="378" text-anchor="middle" class="h">Transform</text><text x="672.5" y="410" text-anchor="middle" class="s">or decompose</text><path d="M775 390 H815" class="flow"/><polygon points="815,390 806,385.5 806,394.5" class="head"/>
<rect x="815" y="330" width="205" height="120" rx="5" class="artifact"/><text x="917.5" y="378" text-anchor="middle" class="h">Representation B</text><text x="917.5" y="410" text-anchor="middle" class="s">alternate view</text><path d="M1020 390 H1060" class="flow"/><polygon points="1060,390 1051,385.5 1051,394.5" class="head"/>
<rect x="1060" y="330" width="205" height="120" rx="5" class="artifact"/><text x="1162.5" y="378" text-anchor="middle" class="h">Candidate</text><text x="1162.5" y="410" text-anchor="middle" class="s">reasoning artifact</text><path d="M1265 390 H1305" class="flow"/><polygon points="1305,390 1296,385.5 1296,394.5" class="head"/>
<rect x="1305" y="330" width="205" height="120" rx="5" class="check"/><text x="1407.5" y="378" text-anchor="middle" class="h">Check</text><text x="1407.5" y="410" text-anchor="middle" class="s">criterion · evidence</text>
<path d="M1407.5 450 V590 H672.5 V475" class="feedback"/><polygon points="672.5,475 668,484 677,484" class="fhead"/><text x="1000" y="620" text-anchor="middle" class="label">reject or revise: change representation and try again</text>
<rect x="80" y="720" width="690" height="90" rx="5" class="note"/><text x="105" y="752" class="k">NOTATION</text><text x="105" y="781" class="s">Blue = state · neutral boxes = artifacts · diamond = transformation</text><text x="105" y="803" class="s">Solid arrow = forward flow · dashed arrow = revision feedback</text>
<rect x="810" y="720" width="700" height="90" rx="5" class="note"/><text x="835" y="752" class="k">PATTERN INVARIANT</text><text x="835" y="781" class="s">The system changes the representation, not the external task contract.</text><text x="835" y="803" class="s">A check determines whether another representation is needed.</text>
</svg>
