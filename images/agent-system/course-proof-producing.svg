<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Proof production with mechanical admission</title><desc id="desc">Search can be increasingly autonomous; accepting a result still requires evidence for the fixed target.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#357477"/></marker></defs><rect width="1120" height="680" rx="20" fill="#f4f7fa"/>
<text x="40" y="49" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#19364b">Proof production with mechanical admission</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Search can be increasingly autonomous; accepting a result still requires evidence for the fixed target.</text>
<rect x="40" y="130" width="310" height="140" rx="12" fill="#e9eef9" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="161" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Fixed specification</text>
<text x="58" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Target and definitions</text>
<text x="58" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Allowed foundations and imports</text>
<text x="58" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Outside candidate edit authority</text>
<rect x="420" y="130" width="310" height="140" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="438" y="161" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Replaceable proof generator</text>
<text x="438" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Explore and propose proofs</text>
<text x="438" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Return proof evidence</text>
<text x="438" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">No self-issued acceptance</text>
<polyline points="350,200 420,200" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="366" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">task</text>
<rect x="420" y="370" width="310" height="150" rx="12" fill="#e7f2f2" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="438" y="401" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Controlled validation</text>
<text x="438" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Match the actual declaration</text>
<text x="438" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Check proof and dependencies</text>
<text x="438" y="480" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Bind receipt to exact inputs</text>
<polyline points="575,270 575,370" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="589" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">candidate evidence</text>
<polyline points="195,270 195,445 420,445" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="225" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">specification</text>
<rect x="800" y="370" width="280" height="150" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="818" y="401" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Accepted theorem library</text>
<text x="818" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Admit only on valid receipt</text>
<text x="818" y="455" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Preserve assumptions and scope</text>
<text x="818" y="480" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">No per-proof human sign-off</text>
<polyline points="730,445 800,445" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="748" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">pass</text>
<polyline points="470,370 470,320 390,320 390,245 420,245" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="366" y="302" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">retry</text>
<text x="800" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#19364b">Separate questions</text>
<text x="800" y="197" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Does the encoding express</text>
<text x="800" y="222" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">the intended problem?</text>
<text x="800" y="252" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">What does validation trust?</text>
<path d="M40 596 H1080" stroke="#cbd8df"/>
<text x="40" y="624" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#19364b">A changed target, definition, or dependency requires renewed validation.</text>
<text x="40" y="652" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#19364b">The diagram specifies a design: Markdown files alone do not enforce isolation or trusted execution.</text>
</svg>