<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Records preserve mathematical meaning</title><desc id="desc">A target and argument are reviewed together using actual evidence. An execution task produces evidence but does not establish the target by its status.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#357477"/></marker></defs><rect width="1120" height="650" rx="18" fill="#f4f7fa"/><g font-family="Arial, sans-serif" fill="#19364b"><text x="36" y="46" font-size="27" fill="#19364b">01 / THE RESEARCH RECORD</text><text x="36" y="79" font-size="18" fill="#19364b">A version identifies what was examined. Evidence explains why it is supported.</text><rect x="40" y="130" width="310" height="125" rx="10" fill="#ffffff" stroke="#9badbb"/><text x="58" y="163" font-size="22" fill="#19364b">Target T2 / version 1</text><text x="58" y="195" font-size="17" fill="#19364b">Produce the requested pair (1,1).</text><text x="58" y="220" font-size="17" fill="#19364b">Objects and assumptions fixed.</text><rect x="430" y="130" width="310" height="125" rx="10" fill="#ffffff" stroke="#9badbb"/><text x="448" y="163" font-size="22" fill="#19364b">Argument A2 / version 1</text><text x="448" y="195" font-size="17" fill="#19364b">Candidate input: c = 1.</text><text x="448" y="220" font-size="17" fill="#19364b">Check: r(1) = (1,1).</text><path d="M430 190H350" fill="none" stroke="#357477" stroke-width="2.4" marker-end="url(#arrow)"/><text x="360" y="174" font-size="16" fill="#19364b">proves</text><rect x="430" y="350" width="310" height="125" rx="10" fill="#ffffff" stroke="#9badbb"/><text x="448" y="383" font-size="22" fill="#19364b">Evidence E2</text><text x="448" y="415" font-size="17" fill="#19364b">The output calculation</text><text x="448" y="440" font-size="17" fill="#19364b">and its mathematical derivation.</text><path d="M585 350V255" fill="none" stroke="#357477" stroke-width="2.4" marker-end="url(#arrow)"/><text x="600" y="310" font-size="17" fill="#19364b">supports</text><rect x="810" y="130" width="270" height="160" rx="10" fill="#e7f2ee" stroke="#9badbb"/><text x="828" y="163" font-size="22" fill="#19364b">Review R2</text><text x="828" y="195" font-size="17" fill="#19364b">Examines T2 and A2.</text><text x="828" y="220" font-size="17" fill="#19364b">Checks witness and scope.</text><text x="828" y="245" font-size="17" fill="#19364b">Records remaining gaps.</text><path d="M810 205H740" fill="none" stroke="#357477" stroke-width="2.4" marker-end="url(#arrow)"/><text x="752" y="183" font-size="16" fill="#19364b">checks</text><rect x="40" y="350" width="310" height="125" rx="10" fill="#edf0f7" stroke="#9badbb"/><text x="58" y="383" font-size="22" fill="#19364b">Execution task J2</text><text x="58" y="415" font-size="17" fill="#19364b">Compute the candidate output.</text><text x="58" y="440" font-size="17" fill="#19364b">Record actual result or failure.</text><path d="M350 412H430" fill="none" stroke="#357477" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="354" y="390" font-size="16" fill="#19364b">produces</text><text x="40" y="550" font-size="20" fill="#19364b">Change (1,1) to (1,0): the calculation survives, but the witness no longer solves the target.</text><text x="40" y="590" font-size="18" fill="#19364b">A completed task is an execution outcome. It is not a proof-status field.</text></g></svg>