<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Minimal surfaces / From comparison to isomorphism</title><desc id="desc">Logical dependencies of Route A. Operational source retrieval is not a proof arrow.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#357477"/></marker></defs><rect width="1120" height="680" rx="20" fill="#f4f7fa"/>
<text x="40" y="49" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#19364b">Minimal surfaces / From comparison to isomorphism</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Logical dependencies of Route A. Operational source retrieval is not a proof arrow.</text>
<rect x="40" y="120" width="1040" height="90" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Common resolution: p: W → X and q: W → Y</text>
<text x="58" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Compatible canonical divisors: K<tspan baseline-shift="sub" font-size="12">W</tspan> = p<tspan baseline-shift="super" font-size="12">∗</tspan> K<tspan baseline-shift="sub" font-size="12">X</tspan> + E<tspan baseline-shift="sub" font-size="12">p</tspan> = q<tspan baseline-shift="super" font-size="12">∗</tspan> K<tspan baseline-shift="sub" font-size="12">Y</tspan> + E<tspan baseline-shift="sub" font-size="12">q</tspan>; define D = E<tspan baseline-shift="sub" font-size="12">q</tspan> − E<tspan baseline-shift="sub" font-size="12">p</tspan></text>
<rect x="40" y="280" width="450" height="110" rx="12" fill="#e7f2f2" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="311" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Negativity over X</text>
<text x="58" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">−D is p-nef; p<tspan baseline-shift="sub" font-size="12">∗</tspan>D = p<tspan baseline-shift="sub" font-size="12">∗</tspan>E<tspan baseline-shift="sub" font-size="12">q</tspan> ≥ 0</text>
<text x="58" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Birkar Lemma 4.15 ⇒ D ≥ 0</text>
<rect x="630" y="280" width="450" height="110" rx="12" fill="#e7f2f2" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="648" y="311" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Negativity over Y</text>
<text x="648" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">D is q-nef; q<tspan baseline-shift="sub" font-size="12">∗</tspan>(−D) = q<tspan baseline-shift="sub" font-size="12">∗</tspan>E<tspan baseline-shift="sub" font-size="12">p</tspan> ≥ 0</text>
<text x="648" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Birkar Lemma 4.15 ⇒ −D ≥ 0</text>
<polyline points="260,210 260,280" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="850,210 850,280" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="40" y="465" width="450" height="100" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="496" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Equality of error divisors</text>
<text x="58" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">D = 0 ⇒ E<tspan baseline-shift="sub" font-size="12">p</tspan> = E<tspan baseline-shift="sub" font-size="12">q</tspan></text>
<text x="58" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Positive coefficients ⇒ same contracted curves</text>
<rect x="630" y="465" width="450" height="100" rx="12" fill="#e9eef9" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="648" y="496" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Descent is still required</text>
<text x="648" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Factor p into point blowups; apply Tag 0C5J</text>
<text x="648" y="550" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Descend q and construct the inverse ⇒ X ≅ Y</text>
<polyline points="260,390 260,465" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="850,390 850,420 440,420 440,465" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="490,515 630,515" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="517" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">return step</text>
<path d="M40 596 H1080" stroke="#cbd8df"/>
<text x="40" y="624" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#19364b">The decisive check: do not stop at equality on the common resolution.</text>
<text x="40" y="652" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#19364b">Each use of negativity has its own sign and base; the descent input is specific to the surface argument.</text>
</svg>