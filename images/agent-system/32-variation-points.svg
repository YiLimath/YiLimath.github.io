<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.m{font:400 15px Arial;fill:#5b6b7c}.k{font:700 18px Arial;fill:#17283c}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.seam{stroke:#7355aa;stroke-width:3;stroke-dasharray:10 8;fill:none}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Variation Points</text><text x="80" y="110" class="sub">A pattern earns its place at the seam between what changes and what must not</text><rect x="860" y="200" width="560" height="440" rx="10" fill="#fdf6ee" stroke="none"/><path d="M860 200 V640" class="seam"/><text x="430" y="248" text-anchor="middle" class="k">STABLE</text><text x="1140" y="248" text-anchor="middle" class="k">VARIES</text><rect x="110" y="370" width="230" height="120" rx="10" class="b"/><text x="225" y="424" text-anchor="middle" class="h">Caller</text><text x="225" y="455" text-anchor="middle" class="m">depends on the contract</text><path d="M340 430 H470" class="l"/><polygon points="470,430 461,425.5 461,434.5" class="al"/><rect x="470" y="290" width="280" height="280" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="610" y="360" text-anchor="middle" class="h">Interface</text><text x="610" y="405" text-anchor="middle" class="s">name and types</text><text x="610" y="440" text-anchor="middle" class="s">error behavior</text><text x="610" y="475" text-anchor="middle" class="s">guarantees</text><text x="610" y="520" text-anchor="middle" class="m">what callers may rely on</text><path d="M750 320 H900" class="l"/><polygon points="900,320 891,315.5 891,324.5" class="al"/><path d="M750 430 H900" class="l"/><polygon points="900,430 891,425.5 891,434.5" class="al"/><path d="M750 540 H900" class="l"/><polygon points="900,540 891,535.5 891,544.5" class="al"/><rect x="900" y="280" width="440" height="80" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="1120" y="328" text-anchor="middle" class="s">one model, one prompt, one vendor</text><rect x="900" y="390" width="440" height="80" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="1120" y="438" text-anchor="middle" class="s">a different model, or a rule</text><rect x="900" y="500" width="440" height="80" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="1120" y="548" text-anchor="middle" class="s">a human, or a deterministic tool</text><rect x="110" y="676" width="230" height="70" rx="8" class="b"/><text x="225" y="706" text-anchor="middle" class="k">SRP</text><text x="225" y="732" text-anchor="middle" class="m">one reason to change</text><rect x="370" y="676" width="230" height="70" rx="8" class="b"/><text x="485" y="706" text-anchor="middle" class="k">OCP</text><text x="485" y="732" text-anchor="middle" class="m">extend, do not edit</text><rect x="630" y="676" width="230" height="70" rx="8" class="b"/><text x="745" y="706" text-anchor="middle" class="k">LSP</text><text x="745" y="732" text-anchor="middle" class="m">substitutable</text><rect x="890" y="676" width="230" height="70" rx="8" class="b"/><text x="1005" y="706" text-anchor="middle" class="k">ISP</text><text x="1005" y="732" text-anchor="middle" class="m">small and complete</text><rect x="1150" y="676" width="230" height="70" rx="8" class="b"/><text x="1265" y="706" text-anchor="middle" class="k">DIP</text><text x="1265" y="732" text-anchor="middle" class="m">depend on abstractions</text><rect x="230" y="790" width="1140" height="60" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="828" text-anchor="middle" class="s">Where nothing varies, a pattern adds indirection and buys nothing.</text></svg>
