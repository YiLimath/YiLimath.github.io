<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 21px Arial;fill:#17283c}.s{font:400 15px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Why Mathematicians Need Design Patterns</text><text x="80" y="110" class="u">Translate recurring research activities into explicit, verifiable interfaces</text><rect x="100" y="365" width="240" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="220" y="408" text-anchor="middle" class="h">Research activity</text><text x="220" y="438" text-anchor="middle" class="s">read · search · prove · write</text><path d="M340 417H490" class="l"/><rect x="490" y="180" width="235" height="95" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="607" y="220" text-anchor="middle" class="h">Decomposition</text><text x="607" y="250" text-anchor="middle" class="s">lemmas · subtasks</text><rect x="490" y="350" width="235" height="95" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="607" y="390" text-anchor="middle" class="h">Abstraction</text><text x="607" y="420" text-anchor="middle" class="s">definitions · interfaces</text><rect x="490" y="520" width="235" height="95" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="607" y="560" text-anchor="middle" class="h">Composition</text><text x="607" y="590" text-anchor="middle" class="s">proof · workflow</text><path d="M340 417H410V227H480" class="l"/><path d="M340 417H480" class="l"/><path d="M340 417H410V567H480" class="l"/><path d="M725 227H850V417" class="l"/><path d="M725 397H850" class="l"/><path d="M725 567H850V417H950" class="l"/><rect x="950" y="365" width="250" height="105" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1075" y="408" text-anchor="middle" class="h">Validation</text><text x="1075" y="438" text-anchor="middle" class="s">check · counterexample · review</text><path d="M1200 417H1340" class="l"/><rect x="1340" y="365" width="180" height="105" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="1430" y="408" text-anchor="middle" class="h">Artifact</text><text x="1430" y="438" text-anchor="middle" class="s">claim + evidence</text><text x="800" y="735" text-anchor="middle" class="s">Patterns reduce cognitive load while preserving mathematical responsibility and traceability.</text><rect x="350" y="765" width="900" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">A reusable boundary is useful only when its assumptions and validation criteria are visible.</text></svg>
