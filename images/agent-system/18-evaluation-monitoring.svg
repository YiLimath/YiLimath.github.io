<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Evaluation and Monitoring Pattern</text><text x="80" y="110" class="u">Measure both the final artifact and the trajectory that produced it</text><rect x="110" y="365" width="250" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="235" y="408" text-anchor="middle" class="h">Agent trajectory</text><text x="235" y="438" text-anchor="middle" class="s">steps · calls · evidence</text><path d="M360 417H530" class="l"/><polygon points="530,417 521,412.5 521,421.5" class="al"/><rect x="530" y="365" width="245" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="652" y="408" text-anchor="middle" class="h">Evaluators</text><text x="652" y="438" text-anchor="middle" class="s">rules · tests · judge</text><path d="M775 417H900" class="l"/><polygon points="900,417 891,412.5 891,421.5" class="al"/><rect x="900" y="185" width="275" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="1037" y="228" text-anchor="middle" class="h">Artifact metrics</text><text x="1037" y="258" text-anchor="middle" class="s">correctness · completeness</text><rect x="900" y="350" width="275" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1037" y="393" text-anchor="middle" class="h">Trajectory metrics</text><text x="1037" y="423" text-anchor="middle" class="s">steps · retries · latency</text><rect x="900" y="515" width="275" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1037" y="558" text-anchor="middle" class="h">Human review</text><text x="1037" y="588" text-anchor="middle" class="s">usefulness · trust</text><path d="M775 417H840V235H890" class="l"/><polygon points="890,235 881,230.5 881,239.5" class="al"/><path d="M775 417H890" class="l"/><polygon points="890,417 881,412.5 881,421.5" class="al"/><path d="M775 417H840V565H890" class="l"/><polygon points="890,565 881,560.5 881,569.5" class="al"/><path d="M1175 235H1300V690H235V470" class="d"/><polygon points="235,470 230.5,479 239.5,479" class="ad"/><path d="M1175 400H1300" class="d"/><polygon points="1300,400 1291,395.5 1291,404.5" class="ad"/><path d="M1175 565H1300" class="d"/><polygon points="1300,565 1291,560.5 1291,569.5" class="ad"/><text x="800" y="735" text-anchor="middle" class="s">Evaluation closes the loop: diagnose, revise the pattern, and rerun the test.</text><rect x="400" y="765" width="800" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">A plausible output is not an adequate metric for an agent system.</text></svg>
