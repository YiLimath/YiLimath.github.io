text-anchor="middle" class="h">Artifact metrics</text><text x="1037" y="258" text-anchor="middle" class="s">correctness · completeness</text><rect x="900" y="350" width="275" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1037" y="393" text-anchor="middle" class="h">Trajectory metrics</text><text x="1037" y="423" text-anchor="middle" class="s">steps · retries · latency</text><rect x="900" y="515" width="275" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1037" y="558" text-anchor="middle" class="h">Human review</text><text x="1037" y="588" text-anchor="middle" class="s">usefulness · trust</text><path d="M775 417H840V235H890" class="l"/><path d="M775 417H890" class="l"/><path d="M775 417H840V565H890" class="l"/><path d="M1175 235H1300V690H235V470" class="d"/><path d="M1175 400H1300" class="d"/><path d="M1175 565H1300" class="d"/><text x="800" y="735" text-anchor="middle" class="s">Evaluation closes the loop: diagnose, revise the pattern, and rerun the test.</text><rect x="400" y="765" width="800" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">A fluent answer is not an adequate metric for a mathematical research system.</text></svg>
