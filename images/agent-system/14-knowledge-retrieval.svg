<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Knowledge Retrieval Pattern</text><text x="80" y="110" class="u">Ground an agent's context in selected sources rather than in memory alone</text><rect x="100" y="350" width="245" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="222" y="395" text-anchor="middle" class="h">Question</text><text x="222" y="427" text-anchor="middle" class="s">claim or proof step</text><path d="M345 405H500" class="l"/><rect x="500" y="350" width="260" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="630" y="395" text-anchor="middle" class="h">Retriever</text><text x="630" y="427" text-anchor="middle" class="s">keyword · semantic · hybrid</text><path d="M760 405H900" class="l"/><rect x="900" y="195" width="275" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="1037" y="238" text-anchor="middle" class="h">Source notes</text><text x="1037" y="268" text-anchor="middle" class="s">theorems · definitions</text><rect x="900" y="350" width="275" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1037" y="393" text-anchor="middle" class="h">Metadata</text><text x="1037" y="423" text-anchor="middle" class="s">date · topic · provenance</text><rect x="900" y="505" width="275" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1037" y="548" text-anchor="middle" class="h">Retrieved context</text><text x="1037" y="578" text-anchor="middle" class="s">ranked evidence bundle</text><path d="M760 405H840V245H890" class="l"/><path d="M760 405H890" class="l"/><path d="M760 405H840V555H890" class="l"/><path d="M1175 555H1310V700H222V460" class="d"/><text x="800" y="720" text-anchor="middle" class="s">Generation should cite the retrieved evidence and disclose missing support.</text><rect x="330" y="765" width="940" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Retrieval quality is a system property: indexing, search, ranking, and context limits all matter.</text></svg>
