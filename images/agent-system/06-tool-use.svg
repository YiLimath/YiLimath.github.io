<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Tool Use Pattern</text><text x="80" y="110" class="sub">Expose external capabilities through a typed action–observation interface</text><rect x="120" y="360" width="230" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="235" y="405" text-anchor="middle" class="h">Agent</text><text x="235" y="436" text-anchor="middle" class="s">decide next action</text><path d="M350 415 H520" class="l"/><polygon points="520,415 511,410.5 511,419.5" class="al"/><rect x="520" y="360" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="645" y="405" text-anchor="middle" class="h">Tool interface</text><text x="645" y="436" text-anchor="middle" class="s">name · schema · arguments</text><path d="M770 415 H900" class="l"/><polygon points="900,415 891,410.5 891,419.5" class="al"/><rect x="900" y="185" width="250" height="95" rx="10" class="b"/><text x="1025" y="225" text-anchor="middle" class="h">Web / API</text><text x="1025" y="255" text-anchor="middle" class="s">external service</text><rect x="900" y="350" width="250" height="95" rx="10" class="b"/><text x="1025" y="390" text-anchor="middle" class="h">Database</text><text x="1025" y="420" text-anchor="middle" class="s">structured state</text><rect x="900" y="515" width="250" height="95" rx="10" class="b"/><text x="1025" y="555" text-anchor="middle" class="h">Code / calculator</text><text x="1025" y="585" text-anchor="middle" class="s">deterministic operation</text><path d="M770 415 H840 V232 H890" class="l"/><polygon points="890,232 881,227.5 881,236.5" class="al"/><path d="M770 415 H890" class="l"/><polygon points="890,415 881,410.5 881,419.5" class="al"/><path d="M770 415 H840 V562 H890" class="l"/><polygon points="890,562 881,557.5 881,566.5" class="al"/><path d="M1150 232 H1240 V690 H235 V470" class="d"/><polygon points="235,470 230.5,479 239.5,479" class="ad"/><path d="M1150 397 H1240" class="d"/><polygon points="1240,397 1231,392.5 1231,401.5" class="ad"/><path d="M1150 562 H1240" class="d"/><polygon points="1240,562 1231,557.5 1231,566.5" class="ad"/><text x="700" y="720" text-anchor="middle" class="s">observation</text><rect x="310" y="755" width="980" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="790" text-anchor="middle" class="s">A tool is a stable interface around a changing capability.</text></svg>
