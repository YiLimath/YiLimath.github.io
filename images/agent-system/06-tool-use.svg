<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
.title{font:700 36px Arial,Helvetica,sans-serif;fill:#17283c}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#5b6b7c}.h{font:700 19px Arial,Helvetica,sans-serif;fill:#17283c}.s{font:400 15px Arial,Helvetica,sans-serif;fill:#405268}.k{font:700 15px Arial,Helvetica,sans-serif;fill:#5b6b7c}.label{font:400 14px Arial,Helvetica,sans-serif;fill:#405268}.life{stroke:#aebbc7;stroke-width:2;stroke-dasharray:8 8}.msg{fill:none;stroke:#28445f;stroke-width:3;stroke-linecap:round}.ret{fill:none;stroke:#2d9180;stroke-width:3;stroke-linecap:round}.head{fill:#28445f;stroke:none}.rhead{fill:#2d9180;stroke:none}.actor{fill:#eaf3fb;stroke:#4f8fbd;stroke-width:2.5}.service{fill:#fff5e6;stroke:#c98425;stroke-width:2.5}.tool{fill:#eef8f5;stroke:#2d9180;stroke-width:2.5}.resource{fill:#f4f7fa;stroke:#6e859b;stroke-width:2.5}.note{fill:#fff;stroke:#c4ced8;stroke-width:1.5}
</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="80" y="75" class="title">Tool Use Pattern — Message Sequence</text><text x="80" y="112" class="sub">Expose an external capability through a typed action request and an explicit observation.</text>
<text x="275" y="205" text-anchor="middle" class="h">Agent</text><text x="650" y="205" text-anchor="middle" class="h">Orchestrator</text><text x="1025" y="205" text-anchor="middle" class="h">Tool adapter</text><text x="1400" y="205" text-anchor="middle" class="h">External resource</text>
<rect x="185" y="225" width="180" height="58" rx="5" class="actor"/><text x="275" y="260" text-anchor="middle" class="s">decision maker</text><rect x="560" y="225" width="180" height="58" rx="5" class="service"/><text x="650" y="260" text-anchor="middle" class="s">dispatch boundary</text><rect x="935" y="225" width="180" height="58" rx="5" class="tool"/><text x="1025" y="260" text-anchor="middle" class="s">typed interface</text><rect x="1310" y="225" width="180" height="58" rx="5" class="resource"/><text x="1400" y="260" text-anchor="middle" class="s">API · data · code</text>
<path d="M275 283 V760" class="life"/><path d="M650 283 V760" class="life"/><path d="M1025 283 V760" class="life"/><path d="M1400 283 V760" class="life"/>
<rect x="263" y="315" width="24" height="390" fill="#dcebf7"/><rect x="638" y="385" width="24" height="260" fill="#fcebd2"/><rect x="1013" y="455" width="24" height="120" fill="#d9f0ea"/>
<path d="M287 335 H638" class="msg"/><polygon points="638,335 629,330.5 629,339.5" class="head"/><text x="462" y="323" text-anchor="middle" class="label">action request: name + arguments</text>
<path d="M662 405 H1013" class="msg"/><polygon points="1013,405 1004,400.5 1004,409.5" class="head"/><text x="837" y="393" text-anchor="middle" class="label">validate schema and permissions</text>
<path d="M1037 475 H1400" class="msg"/><polygon points="1400,475 1391,470.5 1391,479.5" class="head"/><text x="1218" y="463" text-anchor="middle" class="label">invoke capability</text>
<path d="M1400 555 H1037" class="ret"/><polygon points="1037,555 1046,550.5 1046,559.5" class="rhead"/><text x="1218" y="543" text-anchor="middle" class="label">observation / error</text>
<path d="M1013 635 H662" class="ret"/><polygon points="662,635 671,630.5 671,639.5" class="rhead"/><text x="837" y="623" text-anchor="middle" class="label">typed observation</text>
<path d="M638 715 H287" class="ret"/><polygon points="287,715 296,710.5 296,719.5" class="rhead"/><text x="462" y="703" text-anchor="middle" class="label">next state or final response</text>
<rect x="80" y="790" width="1440" height="60" rx="5" class="note"/><text x="800" y="827" text-anchor="middle" class="s">Stable boundary: the agent emits a typed action; the tool returns an observation. Capability implementation may change behind the adapter.</text>
</svg>
