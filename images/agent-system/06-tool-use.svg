<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23364d"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Tool Use Pattern</text><text x="80" y="110" class="sub">Expose external capabilities through a typed action–observation interface</text><rect x="120" y="360" width="230" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="235" y="405" text-anchor="middle" class="h">Agent</text><text x="235" y="436" text-anchor="middle" class="s">decide next action</text><path d="M350 415 H520" class="l"/><rect x="520" y="360" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="645" y="405" text-anchor="middle" class="h">Tool interface</text><text x="645" y="436" text-anchor="middle" class="s">name · schema · arguments</text><path d="M770 415 H900" class="l"/><rect x="900" y="185" width="250" height="95" rx="10" class="b"/><text x="1025" y="225" text-anchor="middle" class="h">Web / API</text><text x="1025" y="255" text-anchor="middle" class="s">external service</text><rect x="900" y="350" width="250" height="95" rx="10" class="b"/><text x="1025" y="390" text-anchor="middle" class="h">Database</text><text x="1025" y="420" text-anchor="middle" class="s">structured state</text><rect x="900" y="515" width="250" height="95" rx="10" class="b"/><text x="1025" y="555" text-anchor="middle" class="h">Code / calculator</text><text x="1025" y="585" text-anchor="middle" class="s">deterministic operation</text><path d="M770 415 H840 V232 H890" class="l"/><path d="M770 415 H890" class="l"/><path d="M770 415 H840 V562 H890" class="l"/><path d="M1150 232 H1240 V690 H235 V470" class="d"/><path d="M1150 397 H1240" class="d"/><path d="M1150 562 H1240" class="d"/><text x="700" y="720" text-anchor="middle" class="s">observation</text><rect x="310" y="755" width="980" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="790" text-anchor="middle" class="s">A tool is a stable interface around a changing capability.</text></svg>
