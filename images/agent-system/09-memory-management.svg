<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
.title{font:700 36px Arial,Helvetica,sans-serif;fill:#17283c}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#5b6b7c}.h{font:700 20px Arial,Helvetica,sans-serif;fill:#17283c}.s{font:400 16px Arial,Helvetica,sans-serif;fill:#405268}.k{font:700 15px Arial,Helvetica,sans-serif;fill:#5b6b7c}.label{font:400 14px Arial,Helvetica,sans-serif;fill:#405268}.flow{fill:none;stroke:#28445f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.write{fill:none;stroke:#2d9180;stroke-width:3;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}.head{fill:#28445f;stroke:none}.whead{fill:#2d9180;stroke:none}.boundary{fill:#fbfcfe;stroke:#9eb0c2;stroke-width:2;stroke-dasharray:10 8}.agent{fill:#eaf3fb;stroke:#4f8fbd;stroke-width:2.5}.policy{fill:#fff5e6;stroke:#c98425;stroke-width:2.5}.context{fill:#eef8f5;stroke:#2d9180;stroke-width:2.5}.note{fill:#fff;stroke:#c4ced8;stroke-width:1.5}
</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="80" y="75" class="title">Memory-Management Pattern — Read / Write Boundary</text><text x="80" y="112" class="sub">Select what persists, retrieve only what is relevant, and keep memory outside the inference step.</text>
<rect x="60" y="180" width="1480" height="490" rx="6" class="boundary"/><text x="90" y="217" class="k">MEMORY SUBSYSTEM</text>
<rect x="100" y="345" width="230" height="120" rx="5" class="agent"/><text x="215" y="393" text-anchor="middle" class="h">Agent state</text><text x="215" y="425" text-anchor="middle" class="s">task · observation</text>
<path d="M330 405 H430" class="flow"/><polygon points="430,405 421,400.5 421,409.5" class="head"/>
<rect x="430" y="345" width="250" height="120" rx="5" class="policy"/><text x="555" y="393" text-anchor="middle" class="h">Memory policy</text><text x="555" y="425" text-anchor="middle" class="s">select · rank · update</text>
<path d="M680 405 H790" class="flow"/><polygon points="790,405 781,400.5 781,409.5" class="head"/><text x="735" y="390" text-anchor="middle" class="label">read query</text>
<path d="M790 405 H870" class="flow"/><polygon points="870,405 861,400.5 861,409.5" class="head"/>
<path d="M870 300 C870 275 1170 275 1170 300 V505 C1170 530 870 530 870 505 Z" fill="#f4f7fa" stroke="#6e859b" stroke-width="2.5"/><ellipse cx="1020" cy="300" rx="150" ry="25" fill="#e7edf2" stroke="#6e859b" stroke-width="2.5"/><text x="1020" y="380" text-anchor="middle" class="h">Memory store</text><text x="1020" y="413" text-anchor="middle" class="s">working · persistent</text><text x="1020" y="445" text-anchor="middle" class="s">selected records</text>
<path d="M1170 405 H1270" class="flow"/><polygon points="1270,405 1261,400.5 1261,409.5" class="head"/><text x="1220" y="390" text-anchor="middle" class="label">retrieved context</text>
<rect x="1270" y="345" width="230" height="120" rx="5" class="context"/><text x="1385" y="393" text-anchor="middle" class="h">Next context</text><text x="1385" y="425" text-anchor="middle" class="s">bounded evidence</text>
<path d="M1270 465 V590 H1020 V530" class="write"/><polygon points="1020,530 1015.5,539 1024.5,539" class="whead"/><text x="1190" y="610" text-anchor="middle" class="label">write / summarize / forget</text>
<rect x="80" y="730" width="680" height="90" rx="5" class="note"/><text x="105" y="762" class="k">NOTATION</text><text x="105" y="791" class="s">Cylinder = persistent store · solid arrow = read path</text><text x="105" y="813" class="s">Dashed arrow = write/update path</text><rect x="810" y="730" width="690" height="90" rx="5" class="note"/><text x="835" y="762" class="k">PATTERN INVARIANT</text><text x="835" y="791" class="s">Memory policy controls what crosses the boundary into context.</text><text x="835" y="813" class="s">The full history is neither required nor automatically replayed.</text>
</svg>
