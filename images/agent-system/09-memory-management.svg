<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#3985c6;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Memory-Management Pattern</text><text x="80" y="110" class="sub">Select, store, and retrieve state instead of replaying the entire history</text><rect x="120" y="365" width="220" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="230" y="410" text-anchor="middle" class="h">Current task</text><text x="230" y="441" text-anchor="middle" class="s">local context</text><path d="M340 420 H485" class="l"/><rect x="485" y="365" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="610" y="410" text-anchor="middle" class="h">Memory policy</text><text x="610" y="441" text-anchor="middle" class="s">select · summarize · rank</text><path d="M735 420 H850" class="l"/><rect x="850" y="190" width="270" height="105" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="985" y="233" text-anchor="middle" class="h">Short-term memory</text><text x="985" y="264" text-anchor="middle" class="s">working state</text><rect x="850" y="365" width="270" height="105" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="985" y="408" text-anchor="middle" class="h">Long-term memory</text><text x="985" y="439" text-anchor="middle" class="s">notes · facts · traces</text><rect x="850" y="540" width="270" height="105" rx="10" fill="#fff" stroke="#9eb0c2" stroke-width="2"/><text x="985" y="583" text-anchor="middle" class="h">Archive</text><text x="985" y="614" text-anchor="middle" class="s">raw source material</text><path d="M735 420 H800 V242 H840" class="l"/><path d="M735 420 H840" class="l"/><path d="M735 420 H800 V592 H840" class="l"/><path d="M1120 242 H1260 V420 H1360" class="d"/><path d="M1120 420 H1360" class="d"/><path d="M1120 592 H1260 V420" class="d"/><rect x="1360" y="365" width="220" height="110" rx="10" class="b"/><text x="1470" y="410" text-anchor="middle" class="h">Retrieved context</text><text x="1470" y="441" text-anchor="middle" class="s">next inference</text><rect x="290" y="745" width="1020" height="60" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="783" text-anchor="middle" class="s">Memory is part of system design: retrieval rules determine what the agent can know.</text></svg>
