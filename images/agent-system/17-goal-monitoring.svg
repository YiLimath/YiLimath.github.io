<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Goal Setting, Prioritization, and Termination</text><text x="80" y="110" class="u">Keep an autonomous loop directed, measurable, and finite</text><rect x="120" y="350" width="250" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="245" y="395" text-anchor="middle" class="h">Goal</text><text x="245" y="427" text-anchor="middle" class="s">question · success criteria</text><path d="M370 405H530" class="l"/><rect x="530" y="350" width="270" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="665" y="395" text-anchor="middle" class="h">Prioritize</text><text x="665" y="427" text-anchor="middle" class="s">value · urgency · cost</text><path d="M800 405H950" class="l"/><rect x="950" y="350" width="250" height="110" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="1075" y="395" text-anchor="middle" class="h">Execute</text><text x="1075" y="427" text-anchor="middle" class="s">bounded next action</text><path d="M1200 405H1370" class="l"/><rect x="1370" y="350" width="150" height="110" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1445" y="395" text-anchor="middle" class="h">Check</text><text x="1445" y="427" text-anchor="middle" class="s">progress?</text><path d="M1445 460V650H665V460" class="d"/><rect x="530" y="620" width="270" height="100" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="665" y="662" text-anchor="middle" class="h">Stop or escalate</text><text x="665" y="692" text-anchor="middle" class="s">done · blocked · human</text><path d="M1370 405H1280V670H810" class="l"/><text x="800" y="770" text-anchor="middle" class="s">A goal is operational only when success, budget, priority, and termination are explicit.</text><rect x="430" y="800" width="740" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="829" text-anchor="middle" class="s">Mathematical research needs a stopping rule as much as a search strategy.</text></svg>
