<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">A geometric reduction needs a return proof</title><desc id="d">Construction and applicability lead to a transformed result. A separate transfer implication must connect it to the original target.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42647c"/></marker></defs><rect width="1000" height="620" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16334a"><text x="30" y="42" font-size="26" font-weight="bold">A geometric reduction needs a return proof</text><rect x="30" y="100" width="350" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="46" y="130" font-size="20">Original problem</text><text x="46" y="157" font-size="16">Objects and hypotheses H</text><text x="46" y="182" font-size="16">Goal: prove C</text><rect x="620" y="100" width="350" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="636" y="130" font-size="20">Transformed problem</text><text x="636" y="157" font-size="16">Construct new objects</text><text x="636" y="182" font-size="16">Establish hypotheses H-prime</text><rect x="620" y="365" width="350" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="636" y="395" font-size="20">Result on new objects</text><text x="636" y="422" font-size="16">Apply a theorem or induction</text><text x="636" y="447" font-size="16">Conclusion C-prime</text><rect x="30" y="365" width="350" height="105" rx="8" fill="#eaf5f0" stroke="#698496"/><text x="46" y="395" font-size="20">Original target closed?</text><text x="46" y="422" font-size="16">Only if C-prime implies C</text><text x="46" y="447" font-size="16">under the recorded assumptions</text><path d="M380 150H620" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="435" y="135" font-size="15">construction</text><path d="M795 205V365" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="810" y="290" font-size="15">applicable result</text><path d="M620 415H380" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="405" y="400" font-size="15">transfer proof required</text><text x="30" y="545" font-size="17">Failure case: a result on a divisor does not automatically give a result on the ambient variety.</text><text x="30" y="580" font-size="17">If the transfer is missing, retain C-prime as a partial result and keep C open.</text></g></svg>