<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
<title id="title">Spiraling induction for birational geometry</title>
<desc id="desc">An acyclic theorem package advances through geometric reductions. A frontier obligation leads to construction and hypothesis checks on a lower-dimensional object, then a theorem invocation. A separate transfer proof returns its conclusion to the original target. Admission advances the ledger; failed checks return repair tasks without admitting the claim.</desc>
<defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#234563"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087e82"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18344c}.title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:650}.body{font-size:21px}.small{font-size:18px;fill:#4d6376}.label{font-size:17px;font-weight:700;letter-spacing:1px}.flow{fill:none;stroke:#234563;stroke-width:3;marker-end:url(#navy)}.return{fill:none;stroke:#087e82;stroke-width:3;marker-end:url(#teal)}</style>
<rect width="1400" height="1040" fill="#f6f8fa"/>
<text x="50" y="58" class="title">Spiraling induction for birational geometry</text>
<text x="50" y="94" class="body">Construct the induction object. Prove the return step. Advance the theorem package.</text>

<rect x="50" y="126" width="1300" height="137" rx="12" fill="#e9f0f6" stroke="#b5c7d4" stroke-width="2"/>
<text x="72" y="163" class="head">THEOREM PACKAGE  /  dimension + proof stage</text>
<text x="72" y="198" class="body">Lower-dimensional inputs → Aₙ, Bₙ → Cₙ → Dₙ → Eₙ → Fₙ → next dimension</text>
<text x="72" y="227" class="body">Schematic order only: each inference retains ALL premises. Base cases and external inputs are explicit.</text>
<text x="50" y="312" class="label">ONE GEOMETRIC TURN</text>
<text x="905" y="312" class="small">Proposal ≠ accepted mathematical fact</text>
<rect x="50" y="342" width="375" height="155" rx="12" fill="#ffffff" stroke="#b5c7d4" stroke-width="2"/>
<text x="72" y="379" class="head">1. Select a frontier claim</text>
<text x="72" y="414" class="body">Exact target and current pair</text>
<text x="72" y="443" class="body">Admitted premises + open gaps</text>
<text x="72" y="472" class="body">Choose a geometric reduction</text>
<rect x="515" y="342" width="370" height="155" rx="12" fill="#e8f5f2" stroke="#72aaa2" stroke-width="2"/>
<text x="537" y="379" class="head">5. Prove the return step</text>
<text x="537" y="414" class="body">Lift sections / descend data</text>
<text x="537" y="443" class="body">Glue morphisms / compare models</text>
<text x="537" y="472" class="body">Recover the original conclusion</text>
<rect x="975" y="342" width="375" height="155" rx="12" fill="#fff4df" stroke="#d7b06b" stroke-width="2"/>
<text x="997" y="379" class="head">6. Admit and advance</text>
<text x="997" y="414" class="body">Check scope and dependencies</text>
<text x="997" y="443" class="body">Apply the declared review policy</text>
<text x="997" y="472" class="body">Commit a versioned artifact</text>
<rect x="50" y="614" width="375" height="155" rx="12" fill="#ffffff" stroke="#b5c7d4" stroke-width="2"/>
<text x="72" y="651" class="head">2. Construct and check</text>
<text x="72" y="686" class="body">Divisor, center, base, or fiber</text>
<text x="72" y="715" class="body">Dimension + singularities</text>
<text x="72" y="744" class="body">Positivity + coefficient set</text>
<rect x="515" y="614" width="370" height="155" rx="12" fill="#ffffff" stroke="#b5c7d4" stroke-width="2"/>
<text x="537" y="651" class="head">3. Invoke an available result</text>
<text x="537" y="686" class="body">Exact lower-dimensional theorem</text>
<text x="537" y="715" class="body">Evidence for every hypothesis</text>
<text x="537" y="744" class="body">An actual induction decrease</text>
<rect x="975" y="614" width="375" height="155" rx="12" fill="#ffffff" stroke="#b5c7d4" stroke-width="2"/>
<text x="997" y="651" class="head">4. Record the local output</text>
<text x="997" y="686" class="body">Conclusion on the new object</text>
<text x="997" y="715" class="body">Preserve all assumptions</text>
<text x="997" y="744" class="body">Return obligation still open</text>
<path d="M237 497 V614" class="flow"/>
<text x="258" y="552" class="small">descend</text>
<path d="M425 691 H515" class="flow"/>
<path d="M885 691 H975" class="flow"/>
<path d="M1162 614 V550 H700 V497" class="return"/>
<text x="764" y="541" class="small">transfer is a separate proof</text>
<path d="M885 420 H975" class="return"/>
<path d="M1350 420 H1375 V282 H380 V342" class="return"/>
<text x="609" y="303" class="small">next frontier</text>
<path d="M237 769 V818 H1162 V769" fill="none" stroke="#ac5b43" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="406" y="808" class="small">Failed check → repair or alternative route; no admission</text>
<rect x="50" y="855" width="630" height="132" rx="12" fill="#ffffff" stroke="#b5c7d4" stroke-width="2"/>
<text x="72" y="892" class="head">SEARCH MAY REVISIT</text>
<text x="72" y="927" class="body">Keep failed constructions and conditional lemmas.</text>
<text x="72" y="956" class="body">Stop with named gaps when evidence runs out.</text>
<rect x="720" y="855" width="630" height="132" rx="12" fill="#ffffff" stroke="#b5c7d4" stroke-width="2"/>
<text x="742" y="892" class="head">ACCEPTED PROOFS MUST BE WELL-FOUNDED</text>
<text x="742" y="927" class="body">No self-dependence, even under a renamed claim.</text>
<text x="742" y="956" class="body">A corrected premise invalidates affected descendants.</text>
<text x="50" y="1020" class="small">Proposed architecture • model review, expert review, and formal checking remain distinct evidence types.</text>
</svg>