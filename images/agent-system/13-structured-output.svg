<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Structured Output Pattern</text><text x="80" y="110" class="u">Make workflow boundaries explicit, parseable, and replaceable</text><rect x="110" y="340" width="230" height="120" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="225" y="390" text-anchor="middle" class="h">Agent step</text><text x="225" y="422" text-anchor="middle" class="s">free-form inference</text><path d="M340 400H520" class="l"/><rect x="520" y="340" width="280" height="120" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="660" y="390" text-anchor="middle" class="h">Schema boundary</text><text x="660" y="422" text-anchor="middle" class="s">fields · types · required data</text><path d="M800 400H980" class="l"/><rect x="980" y="220" width="300" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="1130" y="265" text-anchor="middle" class="h">Theorem record</text><text x="1130" y="295" text-anchor="middle" class="s">objects · hypotheses · conclusion</text><rect x="980" y="365" width="300" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1130" y="410" text-anchor="middle" class="h">Proof-step record</text><text x="1130" y="440" text-anchor="middle" class="s">claim · dependencies · status</text><rect x="980" y="510" width="300" height="105" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1130" y="555" text-anchor="middle" class="h">Citation record</text><text x="1130" y="585" text-anchor="middle" class="s">source · location · provenance</text><path d="M800 400H900V272H970M800 400H970M800 400H900V562H970" class="l"/><path d="M1280 272H1390V690H225V460" class="d"/><path d="M1280 417H1390M1280 562H1390" class="d"/><text x="800" y="730" text-anchor="middle" class="s">The schema does not guarantee truth; it makes failure visible.</text><rect x="360" y="765" width="880" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Stable artifact contract: typed fields + provenance + validation status</text></svg>
