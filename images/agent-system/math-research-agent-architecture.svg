<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23364d"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#70859a;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Case Study: Mathematical Research Agent System</text><text x="80" y="110" class="sub">Three workflows share one external memory: an Obsidian vault of mathematical notes</text><rect x="90" y="180" width="260" height="100" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="220" y="222" text-anchor="middle" class="h">Daily scheduling</text><text x="220" y="253" text-anchor="middle" class="s">plan · prioritize · assign</text><rect x="90" y="370" width="260" height="100" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="220" y="412" text-anchor="middle" class="h">Paper encoding</text><text x="220" y="443" text-anchor="middle" class="s">paper → structured notes</text><rect x="90" y="560" width="260" height="100" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="220" y="602" text-anchor="middle" class="h">Proof checking</text><text x="220" y="633" text-anchor="middle" class="s">claims · dependencies · gaps</text><path d="M350 230 H530" class="l"/><path d="M350 420 H530" class="l"/><path d="M350 610 H530" class="l"/><rect x="530" y="300" width="310" height="260" rx="12" fill="#fff" stroke="#23364d" stroke-width="3"/><text x="685" y="355" text-anchor="middle" class="h">Agent orchestration</text><text x="685" y="398" text-anchor="middle" class="s">router</text><text x="685" y="432" text-anchor="middle" class="s">prompt chains</text><text x="685" y="466" text-anchor="middle" class="s">reflection</text><text x="685" y="500" text-anchor="middle" class="s">tool use</text><path d="M840 430 H1020" class="l"/><rect x="1020" y="260" width="380" height="330" rx="12" fill="#fffdf5" stroke="#d98c2b" stroke-width="3"/><text x="1210" y="315" text-anchor="middle" class="h">Obsidian vault</text><text x="1210" y="355" text-anchor="middle" class="s">long-term external memory</text><rect x="1090" y="390" width="240" height="55" rx="8" fill="#fff" stroke="#9eb0c2" stroke-width="2"/><text x="1210" y="425" text-anchor="middle" class="s">source papers</text><rect x="1090" y="460" width="240" height="55" rx="8" fill="#fff" stroke="#9eb0c2" stroke-width="2"/><text x="1210" y="495" text-anchor="middle" class="s">theorems · proofs · links</text><path d="M1020 575 H930 V690 H685 V560" class="d"/><text x="830" y="685" text-anchor="middle" class="s">retrieve context / write artifacts</text><rect x="530" y="650" width="310" height="95" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="685" y="690" text-anchor="middle" class="h">Researcher</text><text x="685" y="721" text-anchor="middle" class="s">priorities · review · final judgment</text><path d="M685 650 V560" class="l"/><rect x="1020" y="650" width="380" height="95" rx="10" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="1210" y="690" text-anchor="middle" class="h">Design lesson</text><text x="1210" y="721" text-anchor="middle" class="s">patterns make research operations repeatable</text></svg>
