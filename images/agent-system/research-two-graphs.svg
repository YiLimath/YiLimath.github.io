<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="t d"><title id="t">Execution is not logical implication</title><desc id="d">Search has a retry loop. A theorem application requires continuity and compactness jointly, together with the cited theorem.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#486581"/></marker></defs><rect width="1100" height="610" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="35" y="40" font-size="25">Two graphs with different meanings</text><text x="35" y="85" font-size="19">Execution: arrows mean “perform next”</text><rect x="35" y="110" width="270" height="80" rx="8" fill="white" stroke="#486581"/><text x="50" y="140" font-size="19">Propose an argument</text><text x="50" y="167" font-size="15">Immutable target version</text><rect x="415" y="110" width="270" height="80" rx="8" fill="white" stroke="#486581"/><text x="430" y="140" font-size="19">Review the argument</text><text x="430" y="167" font-size="15">Check hypotheses and steps</text><rect x="795" y="110" width="270" height="80" rx="8" fill="white" stroke="#486581"/><text x="810" y="140" font-size="19">Record the outcome</text><text x="810" y="167" font-size="15">Admit or keep obligations</text><rect x="35" y="355" width="270" height="80" rx="8" fill="white" stroke="#486581"/><text x="50" y="385" font-size="19">Continuity on K</text><text x="50" y="412" font-size="15">Premise 1</text><rect x="35" y="475" width="270" height="80" rx="8" fill="white" stroke="#486581"/><text x="50" y="505" font-size="19">Nonempty compact K</text><text x="50" y="532" font-size="15">Premise 2</text><rect x="415" y="410" width="270" height="80" rx="8" fill="white" stroke="#486581"/><text x="430" y="440" font-size="19">Apply cited theorem</text><text x="430" y="467" font-size="15">AND: both premises required</text><rect x="795" y="410" width="270" height="80" rx="8" fill="white" stroke="#486581"/><text x="810" y="440" font-size="19">Maximum attained</text><text x="810" y="467" font-size="15">Conclusion for this K and f</text><path d="M305 150H415" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#a)"/><path d="M685 150H795" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#a)"/><path d="M550 190V240H170V190" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#a)"/><path d="M305 395H360V435H415" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#a)"/><path d="M305 515H360V465H415" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#a)"/><path d="M685 450H795" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#a)"/><text x="240" y="230" font-size="15">gap found: revise and retry</text><path d="M35 280H1065" stroke="#ccd5df"/><text x="35" y="320" font-size="19">Inference: arrows mean “required for this application”</text><text x="415" y="540" font-size="15">Also requires the exact theorem and its scope:</text><text x="415" y="565" font-size="15">f is real-valued; no conclusion for a different domain.</text></g></svg>