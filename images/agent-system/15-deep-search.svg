<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Deep Search Pattern</text><text x="80" y="110" class="u">Turn a broad question into an evidence-producing search process</text><rect x="110" y="350" width="230" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="225" y="395" text-anchor="middle" class="h">Question</text><text x="225" y="427" text-anchor="middle" class="s">scope and constraints</text><path d="M340 405H500" class="l"/><polygon points="500,405 491,400.5 491,409.5" class="al"/><rect x="500" y="350" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="625" y="395" text-anchor="middle" class="h">Decompose</text><text x="625" y="427" text-anchor="middle" class="s">subquestions · queries</text><path d="M750 405H865" class="l"/><polygon points="865,405 856,400.5 856,409.5" class="al"/><rect x="865" y="175" width="260" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="995" y="218" text-anchor="middle" class="h">Search branch A</text><text x="995" y="248" text-anchor="middle" class="s">retrieve and record</text><rect x="865" y="355" width="260" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="995" y="398" text-anchor="middle" class="h">Search branch B</text><text x="995" y="428" text-anchor="middle" class="s">retrieve and record</text><rect x="865" y="535" width="260" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="995" y="578" text-anchor="middle" class="h">Search branch C</text><text x="995" y="608" text-anchor="middle" class="s">retrieve and record</text><path d="M750 405H810V225H855" class="l"/><polygon points="855,225 846,220.5 846,229.5" class="al"/><path d="M750 405H855" class="l"/><polygon points="855,405 846,400.5 846,409.5" class="al"/><path d="M750 405H810V585H855" class="l"/><polygon points="855,585 846,580.5 846,589.5" class="al"/><path d="M1125 225H1235V405" class="l"/><polygon points="1235,405 1230.5,396 1239.5,396" class="al"/><path d="M1125 405H1235" class="l"/><polygon points="1235,405 1226,400.5 1226,409.5" class="al"/><path d="M1125 585H1235V405H1360" class="l"/><polygon points="1360,405 1351,400.5 1351,409.5" class="al"/><rect x="1360" y="350" width="190" height="110" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="1455" y="395" text-anchor="middle" class="h">Synthesis</text><text x="1455" y="427" text-anchor="middle" class="s">evidence + gaps</text><path d="M1455 460V700H225V460" class="d"/><polygon points="225,460 220.5,469 229.5,469" class="ad"/><text x="800" y="735" text-anchor="middle" class="s">Stop when the question is answered, the evidence is saturated, or escalation is required.</text><rect x="390" y="765" width="820" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Deep search is exploration with provenance, not merely a longer prompt.</text></svg>
