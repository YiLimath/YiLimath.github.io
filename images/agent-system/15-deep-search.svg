<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Deep Search Pattern</text><text x="80" y="110" class="u">Turn a broad question into an evidence-producing search process</text><rect x="110" y="350" width="230" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="225" y="395" text-anchor="middle" class="h">Research question</text><text x="225" y="427" text-anchor="middle" class="s">scope and constraints</text><path d="M340 405H500" class="l"/><rect x="500" y="350" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="625" y="395" text-anchor="middle" class="h">Decompose</text><text x="625" y="427" text-anchor="middle" class="s">subquestions · queries</text><path d="M750 405H865" class="l"/><rect x="865" y="175" width="260" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="995" y="218" text-anchor="middle" class="h">Search branch A</text><text x="995" y="248" text-anchor="middle" class="s">retrieve and record</text><rect x="865" y="355" width="260" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="995" y="398" text-anchor="middle" class="h">Search branch B</text><text x="995" y="428" text-anchor="middle" class="s">retrieve and record</text><rect x="865" y="535" width="260" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="995" y="578" text-anchor="middle" class="h">Search branch C</text><text x="995" y="608" text-anchor="middle" class="s">retrieve and record</text><path d="M750 405H810V225H855M750 405H855M750 405H810V585H855" class="l"/><path d="M1125 225H1235V405M1125 405H1235M1125 585H1235V405H1360" class="l"/><rect x="1360" y="350" width="190" height="110" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="1455" y="395" text-anchor="middle" class="h">Synthesis</text><text x="1455" y="427" text-anchor="middle" class="s">evidence + gaps</text><path d="M1455 460V700H225V460" class="d"/><text x="800" y="735" text-anchor="middle" class="s">Stop when the question is answered, the evidence is saturated, or escalation is required.</text><rect x="390" y="765" width="820" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Deep search is exploration with provenance, not merely a longer prompt.</text></svg>
