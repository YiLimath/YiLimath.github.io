<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
.title{font:700 36px Arial,Helvetica,sans-serif;fill:#17283c}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#5b6b7c}.h{font:700 20px Arial,Helvetica,sans-serif;fill:#17283c}.s{font:400 16px Arial,Helvetica,sans-serif;fill:#405268}.k{font:700 15px Arial,Helvetica,sans-serif;fill:#5b6b7c}.label{font:400 14px Arial,Helvetica,sans-serif;fill:#5b6b7c}.flow{fill:none;stroke:#28445f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.head{fill:#28445f;stroke:none}.boundary{fill:#fbfcfe;stroke:#9eb0c2;stroke-width:2;stroke-dasharray:10 8}.input{fill:#eaf3fb;stroke:#4f8fbd;stroke-width:2.5}.router{fill:#fff5e6;stroke:#c98425;stroke-width:2.5}.handler{fill:#f4f7fa;stroke:#6e859b;stroke-width:2.5}.contract{fill:#eef8f5;stroke:#2d9180;stroke-width:2.5}.output{fill:#f7f8fa;stroke:#405268;stroke-width:2.5}.note{fill:#fff;stroke:#c4ced8;stroke-width:1.5}
</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="80" y="75" class="title">Router Pattern — Abstract Structure</text><text x="80" y="112" class="sub">Classify a request, select one interchangeable handler, and preserve a common result contract.</text>
<rect x="450" y="175" width="1000" height="500" rx="6" class="boundary"/><text x="480" y="212" class="k">ROUTING POLICY AND HANDLER SET</text>
<rect x="80" y="365" width="220" height="110" rx="5" class="input"/><text x="190" y="410" text-anchor="middle" class="h">Request</text><text x="190" y="440" text-anchor="middle" class="s">input + context</text><path d="M300 420 H480" class="flow"/><polygon points="480,420 471,415.5 471,424.5" class="head"/>
<polygon points="590,305 700,420 590,535 480,420" class="router"/><text x="590" y="407" text-anchor="middle" class="h">Routing</text><text x="590" y="435" text-anchor="middle" class="s">decision</text>
<path d="M700 420 H780 V290 H850" class="flow"/><polygon points="850,290 841,285.5 841,294.5" class="head"/><text x="735" y="275" class="label">route = α</text><path d="M700 420 H850" class="flow"/><polygon points="850,420 841,415.5 841,424.5" class="head"/><text x="750" y="408" class="label">route = β</text><path d="M700 420 H780 V550 H850" class="flow"/><polygon points="850,550 841,545.5 841,554.5" class="head"/><text x="735" y="570" class="label">route = γ</text>
<rect x="850" y="245" width="240" height="90" rx="5" class="handler"/><text x="970" y="282" text-anchor="middle" class="h">Handler A</text><text x="970" y="310" text-anchor="middle" class="s">specialized policy</text><rect x="850" y="375" width="240" height="90" rx="5" class="handler"/><text x="970" y="412" text-anchor="middle" class="h">Handler B</text><text x="970" y="440" text-anchor="middle" class="s">specialized policy</text><rect x="850" y="505" width="240" height="90" rx="5" class="handler"/><text x="970" y="542" text-anchor="middle" class="h">Handler C</text><text x="970" y="570" text-anchor="middle" class="s">specialized policy</text>
<path d="M1090 290 H1140 V380 H1180" class="flow"/><polygon points="1180,380 1171,375.5 1171,384.5" class="head"/><path d="M1090 420 H1180" class="flow"/><polygon points="1180,420 1171,415.5 1171,424.5" class="head"/><path d="M1090 550 H1140 V460 H1180" class="flow"/><polygon points="1180,460 1171,455.5 1171,464.5" class="head"/>
<rect x="1180" y="350" width="250" height="140" rx="5" class="contract"/><text x="1305" y="398" text-anchor="middle" class="h">Result contract</text><text x="1305" y="428" text-anchor="middle" class="s">shared schema</text><text x="1305" y="456" text-anchor="middle" class="s">status · payload · evidence</text><path d="M1430 420 H1500" class="flow"/><polygon points="1500,420 1491,415.5 1491,424.5" class="head"/><rect x="1500" y="365" width="90" height="110" rx="5" class="output"/><text x="1545" y="410" text-anchor="middle" class="h">Output</text><text x="1545" y="440" text-anchor="middle" class="s">response</text>
<rect x="80" y="715" width="680" height="92" rx="5" class="note"/><text x="105" y="747" class="k">NOTATION</text><text x="105" y="776" class="s">Diamond = routing decision · boxes = interchangeable handlers</text><text x="105" y="798" class="s">Dashed boundary = routing subsystem · arrows = one-way flow</text><rect x="800" y="715" width="790" height="92" rx="5" class="note"/><text x="825" y="747" class="k">PATTERN INVARIANT</text><text x="825" y="776" class="s">The policy and handlers may vary, but every selected handler</text><text x="825" y="798" class="s">satisfies the same result contract.</text>
</svg>
