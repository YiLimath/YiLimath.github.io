<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#d26b57;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Router Pattern</text><text x="80" y="110" class="sub">Classify the request first; send it to the smallest capable specialist</text><rect x="120" y="340" width="220" height="110" rx="10" class="b"/><text x="230" y="385" text-anchor="middle" class="h">Request</text><text x="230" y="416" text-anchor="middle" class="s">unknown type</text><path d="M340 395 H520" class="l"/><polygon points="520,395 511,390.5 511,399.5" class="al"/><polygon points="650,295 790,395 650,495 510,395" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="650" y="390" text-anchor="middle" class="h">Router</text><text x="650" y="422" text-anchor="middle" class="s">classify</text><path d="M790 395 H900 V225 H1010" class="l"/><polygon points="1010,225 1001,220.5 1001,229.5" class="al"/><path d="M790 395 H1010" class="l"/><polygon points="1010,395 1001,390.5 1001,399.5" class="al"/><path d="M790 395 H900 V565 H1010" class="l"/><polygon points="1010,565 1001,560.5 1001,569.5" class="al"/><rect x="1010" y="170" width="260" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="1140" y="215" text-anchor="middle" class="h">Research specialist</text><text x="1140" y="246" text-anchor="middle" class="s">retrieval / sources</text><rect x="1010" y="340" width="260" height="110" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="1140" y="385" text-anchor="middle" class="h">Calculation specialist</text><text x="1140" y="416" text-anchor="middle" class="s">formal / numeric</text><rect x="1010" y="510" width="260" height="110" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1140" y="555" text-anchor="middle" class="h">Writing specialist</text><text x="1140" y="586" text-anchor="middle" class="s">exposition / format</text><path d="M1270 225 H1380 V395" class="r"/><polygon points="1380,395 1375.5,386 1384.5,386" class="ar"/><path d="M1270 395 H1380" class="r"/><polygon points="1380,395 1371,390.5 1371,399.5" class="ar"/><path d="M1270 565 H1380 V395" class="r"/><polygon points="1380,395 1375.5,404 1384.5,404" class="ar"/><rect x="1380" y="340" width="160" height="110" rx="10" class="b"/><text x="1460" y="385" text-anchor="middle" class="h">Response</text><text x="1460" y="416" text-anchor="middle" class="s">common format</text><rect x="250" y="700" width="1100" height="75" rx="10" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="746" text-anchor="middle" class="s">The router localizes variation: specialists may change while the outer interface remains stable.</text></svg>
