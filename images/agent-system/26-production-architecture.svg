<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 20px Arial;fill:#17283c}.s{font:400 14px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Production Architecture for LLM Agents</text><text x="80" y="110" class="u">Apply gateways, caching, fallbacks, observability, and evaluation around the agent core</text><rect x="90" y="360" width="210" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="195" y="402" text-anchor="middle" class="h">Client request</text><text x="195" y="432" text-anchor="middle" class="s">sync or async</text><path d="M300 412H430" class="l"/><polygon points="430,412 421,407.5 421,416.5" class="al"/><rect x="430" y="360" width="250" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="555" y="402" text-anchor="middle" class="h">Gateway</text><text x="555" y="432" text-anchor="middle" class="s">auth · rate · route · log</text><path d="M680 412H800" class="l"/><polygon points="800,412 791,407.5 791,416.5" class="al"/><rect x="800" y="360" width="240" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="920" y="402" text-anchor="middle" class="h">Agent core</text><text x="920" y="432" text-anchor="middle" class="s">prompt · tools · state</text><path d="M1040 412H1160" class="l"/><polygon points="1160,412 1151,407.5 1151,416.5" class="al"/><rect x="1160" y="360" width="250" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1285" y="402" text-anchor="middle" class="h">Model / tools</text><text x="1285" y="432" text-anchor="middle" class="s">providers · retrieval · code</text><path d="M555 360V220H800" class="d"/><polygon points="800,220 791,215.5 791,224.5" class="ad"/><rect x="800" y="170" width="240" height="100" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="920" y="212" text-anchor="middle" class="h">Cache / context</text><text x="920" y="242" text-anchor="middle" class="s">reuse · compress · prune</text><path d="M1040 220H1285V360" class="d"/><polygon points="1285,360 1280.5,351 1289.5,351" class="ad"/><path d="M1285 465V620H1160" class="r"/><polygon points="1160,620 1169,615.5 1169,624.5" class="ar"/><rect x="900" y="570" width="260" height="105" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1030" y="612" text-anchor="middle" class="h">Circuit breaker</text><text x="1030" y="642" text-anchor="middle" class="s">retry · fallback · degrade</text><path d="M900 622H680V465" class="r"/><polygon points="680,465 675.5,474 684.5,474" class="ar"/><rect x="430" y="570" width="250" height="105" rx="10" fill="#fff" stroke="#9eb0c2" class="b"/><text x="555" y="612" text-anchor="middle" class="h">Evaluation</text><text x="555" y="642" text-anchor="middle" class="s">golden set · metrics · traces</text><path d="M680 622H890" class="d"/><polygon points="890,622 881,617.5 881,626.5" class="ad"/><path d="M1410 412H1500V730H555V675" class="d"/><polygon points="555,675 550.5,684 559.5,684" class="ad"/><text x="800" y="755" text-anchor="middle" class="s">Production quality is a system property: reliability, latency, cost, security, and correctness interact.</text><rect x="380" y="795" width="840" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="824" text-anchor="middle" class="s">A fallback must preserve the user's safety and uncertainty requirements.</text></svg>
