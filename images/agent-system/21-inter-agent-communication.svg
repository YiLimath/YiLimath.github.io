<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Inter-Agent Communication</text><text x="80" y="110" class="u">Coordinate specialized agents through explicit messages and protocols</text><rect x="110" y="350" width="240" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="230" y="395" text-anchor="middle" class="h">Agent A</text><text x="230" y="427" text-anchor="middle" class="s">send task</text><path d="M350 405H500" class="l"/><polygon points="500,405 491,400.5 491,409.5" class="al"/><rect x="500" y="350" width="270" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="635" y="395" text-anchor="middle" class="h">Protocol</text><text x="635" y="427" text-anchor="middle" class="s">message · task · result · error</text><path d="M770 405H880" class="l"/><polygon points="880,405 871,400.5 871,409.5" class="al"/><rect x="880" y="190" width="260" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="1010" y="233" text-anchor="middle" class="h">Agent B</text><text x="1010" y="263" text-anchor="middle" class="s">result</text><rect x="880" y="350" width="260" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1010" y="393" text-anchor="middle" class="h">Agent C</text><text x="1010" y="423" text-anchor="middle" class="s">transform result</text><rect x="880" y="510" width="260" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1010" y="553" text-anchor="middle" class="h">Agent D</text><text x="1010" y="583" text-anchor="middle" class="s">evaluate result</text><path d="M770 405H820V240H870" class="l"/><polygon points="870,240 861,235.5 861,244.5" class="al"/><path d="M770 405H870" class="l"/><polygon points="870,405 861,400.5 861,409.5" class="al"/><path d="M770 405H820V560H870" class="l"/><polygon points="870,560 861,555.5 861,564.5" class="al"/><path d="M1140 240H1270V690H230V460" class="d"/><polygon points="230,460 225.5,469 234.5,469" class="ad"/><path d="M1140 400H1270" class="d"/><polygon points="1270,400 1261,395.5 1261,404.5" class="ad"/><path d="M1140 560H1270" class="d"/><polygon points="1270,560 1261,555.5 1261,564.5" class="ad"/><text x="800" y="735" text-anchor="middle" class="s">The protocol is the reusable design boundary; agent identities and models may change.</text><rect x="360" y="765" width="880" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Communication needs ownership, provenance, failure handling, and termination.</text></svg>
