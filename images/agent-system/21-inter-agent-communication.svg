<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Inter-Agent Communication</text><text x="80" y="110" class="u">Coordinate specialized agents through explicit messages and protocols</text><rect x="110" y="350" width="240" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="230" y="395" text-anchor="middle" class="h">Planner</text><text x="230" y="427" text-anchor="middle" class="s">assign subtask</text><path d="M350 405H500" class="l"/><rect x="500" y="350" width="270" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="635" y="395" text-anchor="middle" class="h">Protocol</text><text x="635" y="427" text-anchor="middle" class="s">message · task · result · error</text><path d="M770 405H880" class="l"/><rect x="880" y="190" width="260" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="1010" y="233" text-anchor="middle" class="h">Retriever</text><text x="1010" y="263" text-anchor="middle" class="s">evidence bundle</text><rect x="880" y="350" width="260" height="100" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1010" y="393" text-anchor="middle" class="h">Prover</text><text x="1010" y="423" text-anchor="middle" class="s">check proof obligation</text><rect x="880" y="510" width="260" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1010" y="553" text-anchor="middle" class="h">Critic</text><text x="1010" y="583" text-anchor="middle" class="s">find gaps and risks</text><path d="M770 405H820V240H870" class="l"/><path d="M770 405H870" class="l"/><path d="M770 405H820V560H870" class="l"/><path d="M1140 240H1270V690H230V460" class="d"/><path d="M1140 400H1270" class="d"/><path d="M1140 560H1270" class="d"/><text x="800" y="735" text-anchor="middle" class="s">The protocol is the reusable design boundary; agent identities and models may change.</text><rect x="360" y="765" width="880" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Communication needs ownership, provenance, failure handling, and termination.</text></svg>
