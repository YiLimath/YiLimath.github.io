<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23364d"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.a{fill:#fff4e8;stroke:#d98c2b;stroke-width:3}.g{fill:#e6f4f1;stroke:#219487;stroke-width:3}.r{fill:#faecea;stroke:#d26b57;stroke-width:3}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Human-in-the-Loop Pattern</text><text x="80" y="110" class="sub">Place human judgment at boundaries where errors are costly or authority matters</text><rect x="120" y="365" width="220" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="230" y="410" text-anchor="middle" class="h">Agent proposal</text><text x="230" y="441" text-anchor="middle" class="s">draft action</text><path d="M340 420 H500" class="l"/><rect x="500" y="365" width="270" height="110" rx="10" class="a"/><text x="635" y="410" text-anchor="middle" class="h">Human review</text><text x="635" y="441" text-anchor="middle" class="s">inspect evidence</text><path d="M770 420 H900 V250 H1040" class="l"/><path d="M770 420 H1040" class="l"/><path d="M770 420 H900 V590 H1040" class="l"/><rect x="1040" y="195" width="250" height="110" rx="10" class="g"/><text x="1165" y="240" text-anchor="middle" class="h">Approve</text><text x="1165" y="271" text-anchor="middle" class="s">execute action</text><rect x="1040" y="365" width="250" height="110" rx="10" class="a"/><text x="1165" y="410" text-anchor="middle" class="h">Revise</text><text x="1165" y="441" text-anchor="middle" class="s">return feedback</text><rect x="1040" y="535" width="250" height="110" rx="10" class="r"/><text x="1165" y="580" text-anchor="middle" class="h">Reject</text><text x="1165" y="611" text-anchor="middle" class="s">stop / escalate</text><path d="M1040 420 H960 V730 H230 V475" class="l"/><rect x="300" y="745" width="1000" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="780" text-anchor="middle" class="s">The checkpoint must specify who decides, what evidence is shown, and what each decision does.</text></svg>
