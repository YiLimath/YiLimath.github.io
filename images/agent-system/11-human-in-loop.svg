<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><style>
.title{font:700 36px Arial,Helvetica,sans-serif;fill:#17283c}.sub{font:400 19px Arial,Helvetica,sans-serif;fill:#5b6b7c}.h{font:700 20px Arial,Helvetica,sans-serif;fill:#17283c}.s{font:400 16px Arial,Helvetica,sans-serif;fill:#405268}.k{font:700 15px Arial,Helvetica,sans-serif;fill:#5b6b7c}.label{font:400 14px Arial,Helvetica,sans-serif;fill:#405268}.flow{fill:none;stroke:#28445f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.feedback{fill:none;stroke:#c98425;stroke-width:3;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}.head{fill:#28445f;stroke:none}.fhead{fill:#c98425;stroke:none}.lane{fill:#fbfcfe;stroke:#c4ced8;stroke-width:1.5}.agent{fill:#eaf3fb;stroke:#4f8fbd;stroke-width:2.5}.human{fill:#fff5e6;stroke:#c98425;stroke-width:2.5}.stop{fill:#faecea;stroke:#c65b5b;stroke-width:2.5}.note{fill:#fff;stroke:#c4ced8;stroke-width:1.5}
</style></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="80" y="75" class="title">Human-in-the-Loop Pattern — Approval Gate</text>
<text x="80" y="112" class="sub">Move authority-sensitive decisions into an explicit human checkpoint.</text>
<rect x="80" y="180" width="1440" height="230" rx="5" class="lane"/>
<rect x="80" y="410" width="1440" height="250" rx="5" class="lane"/>
<rect x="80" y="180" width="140" height="230" fill="#eaf3fb" stroke="#c4ced8" stroke-width="1.5"/>
<rect x="80" y="410" width="140" height="250" fill="#fff5e6" stroke="#c4ced8" stroke-width="1.5"/>
<text x="150" y="305" text-anchor="middle" class="h">Agent</text><text x="150" y="535" text-anchor="middle" class="h">Human</text>
<rect x="300" y="260" width="230" height="105" rx="5" class="agent"/>
<text x="415" y="303" text-anchor="middle" class="h">Proposal</text><text x="415" y="335" text-anchor="middle" class="s">draft action + evidence</text>
<path d="M530 312 H650 V520 H730" class="flow"/><polygon points="730,520 721,515.5 721,524.5" class="head"/><text x="585" y="475" class="label">submit for review</text>
<rect x="730" y="465" width="230" height="105" rx="5" class="human"/>
<text x="845" y="508" text-anchor="middle" class="h">Review</text><text x="845" y="540" text-anchor="middle" class="s">inspect evidence</text>
<path d="M960 518 H1000" class="flow"/><polygon points="1000,518 991,513.5 991,522.5" class="head"/>
<polygon points="1075,438 1150,518 1075,598 1000,518" class="human"/>
<text x="1075" y="510" text-anchor="middle" class="h">Decision</text><text x="1075" y="538" text-anchor="middle" class="s">authority?</text>
<path d="M1075 438 V312 H1190" class="flow"/><polygon points="1190,312 1181,307.5 1181,316.5" class="head"/><text x="1090" y="297" class="label">approve</text>
<rect x="1190" y="260" width="230" height="105" rx="5" class="agent"/>
<text x="1305" y="303" text-anchor="middle" class="h">Execute</text><text x="1305" y="335" text-anchor="middle" class="s">authorized action</text>
<path d="M1150 518 H1190" class="flow"/><polygon points="1190,518 1181,513.5 1181,522.5" class="head"/><text x="1165" y="500" text-anchor="end" class="label">reject</text>
<rect x="1190" y="465" width="230" height="105" rx="5" class="stop"/>
<text x="1305" y="508" text-anchor="middle" class="h">Stop / escalate</text><text x="1305" y="540" text-anchor="middle" class="s">no action</text>
<path d="M1075 598 V625 H845 V570" class="feedback"/><polygon points="845,570 840.5,579 849.5,579" class="fhead"/><text x="950" y="650" text-anchor="middle" class="label">revise with human feedback</text>
<path d="M730 570 H620 V700 H415 V365" class="feedback"/><polygon points="415,365 410.5,374 419.5,374" class="fhead"/>
<rect x="80" y="725" width="700" height="90" rx="5" class="note"/><text x="105" y="757" class="k">NOTATION</text><text x="105" y="786" class="s">Lanes = responsibility · diamond = authority decision</text><text x="105" y="808" class="s">Dashed arrow = feedback or revision</text>
<rect x="820" y="725" width="700" height="90" rx="5" class="note"/><text x="845" y="757" class="k">PATTERN INVARIANT</text><text x="845" y="786" class="s">The system must state who decides, what evidence is shown,</text><text x="845" y="808" class="s">and what approve, revise, or reject means.</text>
</svg>
