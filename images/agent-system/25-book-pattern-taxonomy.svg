<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Book-Informed Pattern Taxonomy</title>
<desc id="figure-desc">A crosswalk matrix mapping four reference books to four design dimensions and the corresponding pattern families in the course.</desc>
<defs>
  <style>
