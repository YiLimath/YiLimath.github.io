<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 20px Arial;fill:#17283c}.s{font:400 15px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Book-Informed Pattern Taxonomy</text><text x="80" y="110" class="u">Four complementary viewpoints on the design of agent systems</text><rect x="95" y="180" width="300" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="245" y="223" text-anchor="middle" class="h">Agentic Design Patterns</text><text x="245" y="255" text-anchor="middle" class="s">broad pattern catalogue</text><rect x="95" y="355" width="300" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="245" y="398" text-anchor="middle" class="h">Designing Multi-Agent Systems</text><text x="245" y="430" text-anchor="middle" class="s">workflow and autonomy</text><rect x="95" y="530" width="300" height="110" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="245" y="573" text-anchor="middle" class="h">Generative AI Design Patterns</text><text x="245" y="605" text-anchor="middle" class="s">fine-grained application patterns</text><rect x="95" y="705" width="300" height="110" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="245" y="748" text-anchor="middle" class="h">System Design for the LLM Era</text><text x="245" y="780" text-anchor="middle" class="s">production constraints</text><path d="M395 235H570M395 410H570M395 585H570M395 760H570" class="l"/><rect x="570" y="300" width="350" height="310" rx="12" fill="#fff" stroke="#23364d" class="b"/><text x="745" y="350" text-anchor="middle" class="h">Shared design questions</text><text x="745" y="395" text-anchor="middle" class="s">What is the stable interface?</text><text x="745" y="435" text-anchor="middle" class="s">Where is state kept?</text><text x="745" y="475" text-anchor="middle" class="s">How is failure detected?</text><text x="745" y="515" text-anchor="middle" class="s">When does the system stop?</text><path d="M920 455H1080" class="l"/><rect x="1080" y="300" width="420" height="310" rx="12" fill="#fffdf5" stroke="#d98c2b" class="b"/><text x="1290" y="350" text-anchor="middle" class="h">This series translates them into</text><text x="1290" y="400" text-anchor="middle" class="s">workflow and control-flow patterns</text><text x="1290" y="440" text-anchor="middle" class="s">knowledge and reasoning patterns</text><text x="1290" y="480" text-anchor="middle" class="s">multi-agent and human coordination</text><text x="1290" y="520" text-anchor="middle" class="s">reliability and operations</text><text x="800" y="735" text-anchor="middle" class="s">The books provide the vocabulary; the page examples provide the domain translation.</text><rect x="390" y="765" width="820" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Choose the smallest pattern composition that makes uncertainty observable.</text></svg>
