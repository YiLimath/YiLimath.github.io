<rect x="100" y="875" width="1400" height="70" rx="10" fill="#ffffff" stroke="#c4ced8" stroke-width="2"/>
<text x="130" y="905" class="small">INTERPRETATION</text>
<text x="320" y="905" class="body">The books overlap; no single book owns one row. The matrix records complementary emphasis, while the right column records this course's synthesis.</text>
<text x="130" y="929" class="small">The diagrams are newly drawn from these concepts; they are not copied from the books' artwork.</text>
