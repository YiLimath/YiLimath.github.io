<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#7355aa;stroke:none}.ar{fill:#c65b5b;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.m{font:400 15px Arial;fill:#5b6b7c}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#7355aa;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">The Verification Gate</text><text x="80" y="110" class="sub">Search may be wrong as often as it likes; only an accepted result may be depended upon</text><rect x="90" y="280" width="230" height="130" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="205" y="332" text-anchor="middle" class="h">Generate</text><text x="205" y="363" text-anchor="middle" class="m">broad, cheap</text><text x="205" y="388" text-anchor="middle" class="m">allowed to be wrong</text><path d="M320 345 H390" class="l"/><polygon points="390,345 381,340.5 381,349.5" class="al"/><rect x="390" y="280" width="200" height="130" rx="10" class="b"/><text x="490" y="335" text-anchor="middle" class="h">Candidate</text><text x="490" y="368" text-anchor="middle" class="m">claim + argument</text><path d="M590 345 H660" class="l"/><polygon points="660,345 651,340.5 651,349.5" class="al"/><rect x="660" y="260" width="240" height="170" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="780" y="318" text-anchor="middle" class="h">Verifier</text><text x="780" y="352" text-anchor="middle" class="m">independent of the</text><text x="780" y="376" text-anchor="middle" class="m">generator; cold context</text><text x="780" y="408" text-anchor="middle" class="m">binary verdict</text><path d="M900 345 H970" class="l"/><polygon points="970,345 961,340.5 961,349.5" class="al"/><rect x="970" y="280" width="150" height="130" rx="10" class="b"/><text x="1045" y="330" text-anchor="middle" class="h">Gate</text><text x="1045" y="365" text-anchor="middle" class="m">no errors</text><text x="1045" y="390" text-anchor="middle" class="m">no gaps</text><path d="M1120 345 H1190" class="r"/><polygon points="1190,345 1181,340.5 1181,349.5" class="ar"/><text x="1155" y="325" text-anchor="middle" class="m">accept</text><rect x="1190" y="260" width="290" height="170" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1335" y="318" text-anchor="middle" class="h">Fact store</text><text x="1335" y="352" text-anchor="middle" class="m">content-addressed</text><text x="1335" y="376" text-anchor="middle" class="m">dependency edges</text><text x="1335" y="408" text-anchor="middle" class="m">the only citable tier</text><path d="M1045 410 V560 H205 V410" class="d"/><polygon points="205,410 200.5,419 209.5,419" class="ad"/><text x="625" y="592" text-anchor="middle" class="s">reject: named criterion and repair hints, never a bare score</text><rect x="980" y="668" width="150" height="64" rx="8" class="b"/><text x="1055" y="707" text-anchor="middle" class="s">fact A</text><path d="M1130 700 H1200" class="l"/><polygon points="1200,700 1191,695.5 1191,704.5" class="al"/><rect x="1200" y="668" width="150" height="64" rx="8" class="b"/><text x="1275" y="707" text-anchor="middle" class="s">fact B</text><path d="M1350 700 H1420" class="l"/><polygon points="1420,700 1411,695.5 1411,704.5" class="al"/><rect x="1420" y="668" width="150" height="64" rx="8" class="b"/><text x="1495" y="707" text-anchor="middle" class="s">fact C</text><path d="M1020 665 L1090 735 M1090 665 L1020 735" class="r"/><text x="1275" y="782" text-anchor="middle" class="s">revoking a fact revokes everything that depended on it</text><rect x="120" y="668" width="760" height="64" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="500" y="695" text-anchor="middle" class="s">A finding is awareness. Only an accepted fact is a brick.</text><text x="500" y="719" text-anchor="middle" class="m">&#8220;correct modulo a routine argument&#8221; is not accepted</text></svg>
