<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.g{fill:#e6f1fb;stroke:#3985c6;stroke-width:3}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Parallelization Pattern</text><text x="80" y="110" class="sub">Run independent subproblems concurrently; combine their results at a stable boundary</text><rect x="100" y="365" width="220" height="110" rx="10" class="b"/><text x="210" y="410" text-anchor="middle" class="h">Input</text><text x="210" y="441" text-anchor="middle" class="s">one task</text><path d="M320 420 H430" class="l"/><polygon points="430,420 421,415.5 421,424.5" class="al"/><circle cx="470" cy="420" r="30" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="470" y="427" text-anchor="middle" class="h">×</text><path d="M500 420 H610 V235 H720" class="l"/><polygon points="720,235 711,230.5 711,239.5" class="al"/><path d="M500 420 H720" class="l"/><polygon points="720,420 711,415.5 711,424.5" class="al"/><path d="M500 420 H610 V605 H720" class="l"/><polygon points="720,605 711,600.5 711,609.5" class="al"/><rect x="720" y="180" width="250" height="110" rx="10" class="g"/><text x="845" y="225" text-anchor="middle" class="h">Agent A</text><text x="845" y="256" text-anchor="middle" class="s">subproblem 1</text><rect x="720" y="365" width="250" height="110" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="845" y="410" text-anchor="middle" class="h">Agent B</text><text x="845" y="441" text-anchor="middle" class="s">subproblem 2</text><rect x="720" y="550" width="250" height="110" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="845" y="595" text-anchor="middle" class="h">Agent C</text><text x="845" y="626" text-anchor="middle" class="s">subproblem 3</text><path d="M970 235 H1090 V420" class="l"/><polygon points="1090,420 1085.5,411 1094.5,411" class="al"/><path d="M970 420 H1090" class="l"/><polygon points="1090,420 1081,415.5 1081,424.5" class="al"/><path d="M970 605 H1090 V420" class="l"/><polygon points="1090,420 1085.5,429 1094.5,429" class="al"/><circle cx="1130" cy="420" r="30" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="1130" y="427" text-anchor="middle" class="h">+</text><path d="M1160 420 H1275" class="l"/><polygon points="1275,420 1266,415.5 1266,424.5" class="al"/><rect x="1275" y="365" width="220" height="110" rx="10" class="b"/><text x="1385" y="410" text-anchor="middle" class="h">Output</text><text x="1385" y="441" text-anchor="middle" class="s">combined answer</text><rect x="300" y="745" width="1000" height="60" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="783" text-anchor="middle" class="s">Use only when the branches are independent or have explicit synchronization.</text></svg>
