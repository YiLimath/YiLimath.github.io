<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Alternative arguments survive independently</title><desc id="d">Each argument requires all its premises. A statement can remain usable through a second valid argument after the first loses a premise.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42647c"/></marker></defs><rect width="1000" height="620" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16334a"><text x="30" y="42" font-size="26" font-weight="bold">Alternative arguments survive independently</text><rect x="30" y="100" width="290" height="80" rx="8" fill="#ffffff" stroke="#698496"/><text x="46" y="130" font-size="20">Premises A and B</text><text x="46" y="157" font-size="16">Both needed for argument 1</text><rect x="390" y="100" width="270" height="80" rx="8" fill="#fff4e6" stroke="#698496"/><text x="406" y="130" font-size="20">Argument 1</text><text x="406" y="157" font-size="16">Withdraw B: suspend use</text><rect x="30" y="350" width="290" height="80" rx="8" fill="#ffffff" stroke="#698496"/><text x="46" y="380" font-size="20">Premises C and D</text><text x="46" y="407" font-size="16">Both needed for argument 2</text><rect x="390" y="350" width="270" height="80" rx="8" fill="#eaf5f0" stroke="#698496"/><text x="406" y="380" font-size="20">Argument 2</text><text x="406" y="407" font-size="16">All premises still usable</text><rect x="740" y="225" width="230" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="756" y="255" font-size="20">Statement S</text><text x="756" y="282" font-size="16">Usable via argument 2</text><text x="756" y="307" font-size="16">under the same policy</text><path d="M320 140H390" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="335" y="125" font-size="15">AND</text><path d="M320 390H390" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="335" y="375" font-size="15">AND</text><path d="M659 140H700V250H740" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="0" y="0" font-size="15"></text><path d="M659 390H700V290H740" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="0" y="0" font-size="15"></text><text x="745" y="205" font-size="16">OR: complete alternatives</text><text x="30" y="525" font-size="17">Withdrawal changes argument usability. It does not prove that statement S is false.</text><text x="30" y="565" font-size="17">The ledger must store statements separately from the arguments supporting them.</text></g></svg>