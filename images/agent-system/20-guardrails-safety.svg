<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;marker-end:url(#r-arrow);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Guardrails and Safety</text><text x="80" y="110" class="u">Constrain inputs, actions, outputs, and escalation paths</text><rect x="100" y="365" width="230" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="215" y="408" text-anchor="middle" class="h">Request</text><text x="215" y="438" text-anchor="middle" class="s">user or environment</text><path d="M330 417H480" class="l"/><rect x="480" y="365" width="240" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="600" y="408" text-anchor="middle" class="h">Input guardrail</text><text x="600" y="438" text-anchor="middle" class="s">scope · policy · sanitize</text><path d="M720 417H850" class="l"/><rect x="850" y="365" width="240" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="970" y="408" text-anchor="middle" class="h">Agent action</text><text x="970" y="438" text-anchor="middle" class="s">reason · call · write</text><path d="M1090 417H1230" class="l"/><rect x="1230" y="365" width="240" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1350" y="408" text-anchor="middle" class="h">Output guardrail</text><text x="1350" y="438" text-anchor="middle" class="s">validate · redact · cite</text><path d="M970 365V220H1150" class="r"/><rect x="1150" y="170" width="280" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="1290" y="213" text-anchor="middle" class="h">Blocked or escalated</text><text x="1290" y="243" text-anchor="middle" class="s">deny · review · safe stop</text><path d="M1290 270V665H970V470" class="d"/><path d="M1470 470V665H215V470" class="d"/><text x="800" y="735" text-anchor="middle" class="s">Safety is an architectural boundary, not a last-minute instruction.</text><rect x="390" y="765" width="820" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">For mathematics: separate source, conjecture, verified result, and generated explanation.</text></svg>
