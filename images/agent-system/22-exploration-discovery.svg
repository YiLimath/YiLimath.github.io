<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Exploration and Discovery</text><text x="80" y="110" class="u">Search alternatives while preserving diversity, tests, and evidence</text><rect x="110" y="360" width="230" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="225" y="403" text-anchor="middle" class="h">Input</text><text x="225" y="433" text-anchor="middle" class="s">initial state</text><path d="M340 412H480" class="l"/><polygon points="480,412 471,407.5 471,416.5" class="al"/><rect x="480" y="360" width="250" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="605" y="403" text-anchor="middle" class="h">Branch / mutate</text><text x="605" y="433" text-anchor="middle" class="s">alternative candidates</text><path d="M730 412H850" class="l"/><polygon points="850,412 841,407.5 841,416.5" class="al"/><rect x="850" y="190" width="245" height="95" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="972" y="230" text-anchor="middle" class="h">Candidate A</text><text x="972" y="260" text-anchor="middle" class="s">test and record</text><rect x="850" y="360" width="245" height="95" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="972" y="400" text-anchor="middle" class="h">Candidate B</text><text x="972" y="430" text-anchor="middle" class="s">test and record</text><rect x="850" y="530" width="245" height="95" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="972" y="570" text-anchor="middle" class="h">Candidate C</text><text x="972" y="600" text-anchor="middle" class="s">test and record</text><path d="M730 412H800V237H840" class="l"/><polygon points="840,237 831,232.5 831,241.5" class="al"/><path d="M730 412H840" class="l"/><polygon points="840,412 831,407.5 831,416.5" class="al"/><path d="M730 412H800V577H840" class="l"/><polygon points="840,577 831,572.5 831,581.5" class="al"/><path d="M1095 237H1240V412" class="l"/><polygon points="1240,412 1235.5,403 1244.5,403" class="al"/><path d="M1095 412H1240" class="l"/><polygon points="1240,412 1231,407.5 1231,416.5" class="al"/><path d="M1095 577H1240V412H1370" class="l"/><polygon points="1370,412 1361,407.5 1361,416.5" class="al"/><rect x="1370" y="360" width="180" height="105" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="1460" y="403" text-anchor="middle" class="h">Select / stop</text><text x="1460" y="433" text-anchor="middle" class="s">evidence + rule</text><path d="M1460 465V690H225V465" class="d"/><polygon points="225,465 220.5,474 229.5,474" class="ad"/><text x="800" y="735" text-anchor="middle" class="s">Exploration produces candidates; validation or human judgment decides what survives.</text><rect x="390" y="765" width="820" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">Use a budget, duplicate control, scoring rule, and termination condition.</text></svg>
