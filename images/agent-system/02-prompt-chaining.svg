<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.num{font:700 20px Arial;fill:#fff}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Prompt Chaining Pattern</text><text x="80" y="110" class="sub">Decompose one task into a sequence of explicit, testable transformations</text><circle cx="150" cy="260" r="27" fill="#3985c6"/><text x="150" y="267" text-anchor="middle" class="num">0</text><rect x="205" y="205" width="210" height="110" rx="10" class="b"/><text x="310" y="250" text-anchor="middle" class="h">Input</text><text x="310" y="280" text-anchor="middle" class="s">raw task</text><path d="M415 260 H485" class="l"/><circle cx="535" cy="260" r="27" fill="#3985c6"/><text x="535" y="267" text-anchor="middle" class="num">1</text><rect x="590" y="205" width="210" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="695" y="250" text-anchor="middle" class="h">Extract</text><text x="695" y="280" text-anchor="middle" class="s">relevant facts</text><path d="M800 260 H870" class="l"/><circle cx="920" cy="260" r="27" fill="#7355aa"/><text x="920" y="267" text-anchor="middle" class="num">2</text><rect x="975" y="205" width="210" height="110" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="1080" y="250" text-anchor="middle" class="h">Transform</text><text x="1080" y="280" text-anchor="middle" class="s">normalize / structure</text><path d="M1185 260 H1255" class="l"/><circle cx="1305" cy="260" r="27" fill="#219487"/><text x="1305" y="267" text-anchor="middle" class="num">3</text><rect x="1360" y="205" width="170" height="110" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1445" y="250" text-anchor="middle" class="h">Compose</text><text x="1445" y="280" text-anchor="middle" class="s">final answer</text><rect x="205" y="455" width="1325" height="120" rx="10" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="250" y="500" class="h">Why use it?</text><text x="250" y="535" class="s">Each intermediate result can be inspected, constrained, cached, or replaced.</text><text x="250" y="562" class="s">The chain buys determinism by making hidden reasoning into visible interfaces.</text><path d="M310 315 V400 H695 V315" class="l"/><text x="800" y="700" text-anchor="middle" class="s">Stable contract: each stage consumes a defined input and returns a defined output.</text></svg>
