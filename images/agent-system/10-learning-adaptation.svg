<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#23364d"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#7355aa;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Learning and Adaptation Pattern</text><text x="80" y="110" class="sub">Use evaluated experience to improve future behavior without changing the task interface</text><rect x="120" y="365" width="220" height="110" rx="10" class="b"/><text x="230" y="410" text-anchor="middle" class="h">Task traces</text><text x="230" y="441" text-anchor="middle" class="s">inputs · actions · outcomes</text><path d="M340 420 H490" class="l"/><rect x="490" y="365" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="615" y="410" text-anchor="middle" class="h">Evaluator</text><text x="615" y="441" text-anchor="middle" class="s">quality / safety signal</text><path d="M740 420 H890" class="l"/><rect x="890" y="365" width="250" height="110" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="1015" y="410" text-anchor="middle" class="h">Update rule</text><text x="1015" y="441" text-anchor="middle" class="s">prompt · policy · memory</text><path d="M1140 420 H1290" class="l"/><rect x="1290" y="365" width="220" height="110" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1400" y="410" text-anchor="middle" class="h">Future tasks</text><text x="1400" y="441" text-anchor="middle" class="s">adapted behavior</text><path d="M1400 365 V220 H230 V365" class="d"/><text x="800" y="200" text-anchor="middle" class="s">feedback loop</text><rect x="390" y="610" width="820" height="100" rx="10" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="650" text-anchor="middle" class="h">Guardrail</text><text x="800" y="682" text-anchor="middle" class="s">Never optimize a metric without checking what the metric omits.</text><path d="M1015 475 V610" class="d"/><rect x="300" y="770" width="1000" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="805" text-anchor="middle" class="s">Adaptation changes the implementation; the external contract should remain stable.</text></svg>
