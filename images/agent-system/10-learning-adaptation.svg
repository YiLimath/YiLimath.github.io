<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#7355aa;stroke-width:3;stroke-dasharray:9 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Learning and Adaptation Pattern</text><text x="80" y="110" class="sub">Use evaluated experience to improve future behavior without changing the task interface</text><rect x="120" y="365" width="220" height="110" rx="10" class="b"/><text x="230" y="410" text-anchor="middle" class="h">Task traces</text><text x="230" y="441" text-anchor="middle" class="s">inputs · actions · outcomes</text><path d="M340 420 H490" class="l"/><polygon points="490,420 481,415.5 481,424.5" class="al"/><rect x="490" y="365" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="615" y="410" text-anchor="middle" class="h">Evaluator</text><text x="615" y="441" text-anchor="middle" class="s">quality / safety signal</text><path d="M740 420 H890" class="l"/><polygon points="890,420 881,415.5 881,424.5" class="al"/><rect x="890" y="365" width="250" height="110" rx="10" fill="#eee8fb" stroke="#7355aa" stroke-width="3"/><text x="1015" y="410" text-anchor="middle" class="h">Update rule</text><text x="1015" y="441" text-anchor="middle" class="s">prompt · policy · memory</text><path d="M1140 420 H1290" class="l"/><polygon points="1290,420 1281,415.5 1281,424.5" class="al"/><rect x="1290" y="365" width="220" height="110" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1400" y="410" text-anchor="middle" class="h">Future tasks</text><text x="1400" y="441" text-anchor="middle" class="s">adapted behavior</text><path d="M1400 365 V220 H230 V365" class="d"/><polygon points="230,365 225.5,356 234.5,356" class="ad"/><text x="800" y="200" text-anchor="middle" class="s">feedback loop</text><rect x="390" y="610" width="820" height="100" rx="10" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="650" text-anchor="middle" class="h">Guardrail</text><text x="800" y="682" text-anchor="middle" class="s">Never optimize a metric without checking what the metric omits.</text><path d="M1015 475 V610" class="d"/><polygon points="1015,610 1010.5,601 1019.5,601" class="ad"/><rect x="300" y="770" width="1000" height="55" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="805" text-anchor="middle" class="s">Adaptation changes the implementation; the external contract should remain stable.</text></svg>
