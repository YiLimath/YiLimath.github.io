<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
<defs><style>
.title{font:700 36px Arial,sans-serif;fill:#17283c}.sub{font:400 19px Arial,sans-serif;fill:#536a7f}.label{font:700 16px Arial,sans-serif;fill:#476176;letter-spacing:1px}.h{font:700 22px Arial,sans-serif;fill:#17283c}.s{font:400 16px Arial,sans-serif;fill:#405268}.small{font:400 14px Arial,sans-serif;fill:#536b80}.tiny{font:700 13px Arial,sans-serif;fill:#5a7082;letter-spacing:.6px}.flow{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.evidence{stroke:#219487;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.update{stroke:#735fbd;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}.boundary{fill:#fbfcfe;stroke:#b8c7d5;stroke-width:2}.panel{fill:#f5f8fb;stroke:#c5d1dc;stroke-width:2}.card{stroke-width:3}.note{fill:#fff;stroke:#c4ced8;stroke-width:2}
</style></defs>
<rect width="1800" height="1150" fill="#f7f9fc"/>
<text x="70" y="75" class="title">Learning and Adaptation</text>
<text x="70" y="112" class="sub">Improve future behavior from evaluated experience while protecting the live task contract</text>
<g transform="translate(1260,62)"><line x1="0" y1="0" x2="38" y2="0" class="flow"/><polygon points="38,0 29,-4.5 29,4.5" fill="#23364d"/><text x="52" y="6" class="small">online run</text><line x1="155" y1="0" x2="193" y2="0" class="evidence"/><polygon points="193,0 184,-4.5 184,4.5" fill="#219487"/><text x="207" y="6" class="small">trace / evidence</text><line x1="365" y1="0" x2="403" y2="0" class="update"/><polygon points="403,0 394,-4.5 394,4.5" fill="#735fbd"/><text x="417" y="6" class="small">approved update</text></g>

<!-- online execution plane -->
<rect x="80" y="165" width="1640" height="335" rx="16" class="boundary"/><text x="115" y="201" class="label">ONLINE EXECUTION PLANE</text>
<rect x="120" y="290" width="220" height="110" rx="11" fill="#e6f1fb" stroke="#3985c6" class="card"/><text x="230" y="333" text-anchor="middle" class="h">Task</text><text x="230" y="365" text-anchor="middle" class="s">request + context</text>
<rect x="415" y="290" width="260" height="110" rx="11" fill="#fff4e8" stroke="#d98c2b" class="card"/><text x="545" y="333" text-anchor="middle" class="h">Current policy</text><text x="545" y="365" text-anchor="middle" class="s">prompt · route · memory</text>
<rect x="750" y="290" width="260" height="110" rx="11" fill="#e9f5f1" stroke="#219487" class="card"/><text x="880" y="333" text-anchor="middle" class="h">Agent execution</text><text x="880" y="365" text-anchor="middle" class="s">action · tool · response</text>
<rect x="1085" y="290" width="250" height="110" rx="11" fill="#fff" stroke="#6e83a0" class="card"/><text x="1210" y="333" text-anchor="middle" class="h">Outcome</text><text x="1210" y="365" text-anchor="middle" class="s">quality · safety · cost</text>
<rect x="1410" y="290" width="250" height="110" rx="11" fill="#e9f5f1" stroke="#219487" class="card"/><text x="1535" y="333" text-anchor="middle" class="h">Trace log</text><text x="1535" y="365" text-anchor="middle" class="s">inputs · actions · result</text>
<path d="M340 345H415" class="flow"/><polygon points="415,345 406,340.5 406,349.5" fill="#23364d"/><path d="M675 345H750" class="flow"/><polygon points="750,345 741,340.5 741,349.5" fill="#23364d"/><path d="M1010 345H1085" class="flow"/><polygon points="1085,345 1076,340.5 1076,349.5" fill="#23364d"/><path d="M1335 345H1410" class="evidence"/><polygon points="1410,345 1401,340.5 1401,349.5" fill="#219487"/>

<!-- offline adaptation plane -->
<rect x="80" y="565" width="1640" height="430" rx="16" class="boundary"/><text x="115" y="601" class="label">OFFLINE ADAPTATION PLANE</text><text x="1685" y="601" text-anchor="end" class="small">update only after evaluation</text>
<rect x="120" y="700" width="245" height="120" rx="11" fill="#e9f5f1" stroke="#219487" class="card"/><text x="242" y="742" text-anchor="middle" class="h">Trace sample</text><text x="242" y="774" text-anchor="middle" class="s">successes + failures</text><text x="242" y="798" text-anchor="middle" class="small">with provenance</text>
<rect x="445" y="700" width="245" height="120" rx="11" fill="#fff4e8" stroke="#d98c2b" class="card"/><text x="567" y="742" text-anchor="middle" class="h">Evaluator</text><text x="567" y="774" text-anchor="middle" class="s">quality · safety · drift</text><text x="567" y="798" text-anchor="middle" class="small">held-out comparison</text>
<rect x="770" y="700" width="245" height="120" rx="11" fill="#f0ebfb" stroke="#735fbd" class="card"/><text x="892" y="742" text-anchor="middle" class="h">Lesson extractor</text><text x="892" y="774" text-anchor="middle" class="s">condition → action → result</text><text x="892" y="798" text-anchor="middle" class="small">testable change</text>
<rect x="1095" y="700" width="245" height="120" rx="11" fill="#edf3fb" stroke="#527ea8" class="card"/><text x="1217" y="742" text-anchor="middle" class="h">Candidate policy</text><text x="1217" y="774" text-anchor="middle" class="s">versioned artifact</text><text x="1217" y="798" text-anchor="middle" class="small">scope + rollback</text>
<polygon points="1460,690 1545,760 1460,830 1375,760" fill="#fff" stroke="#3985c6" stroke-width="3"/><text x="1460" y="754" text-anchor="middle" class="h">Pass gate?</text><text x="1460" y="778" text-anchor="middle" class="small">held-out set</text>
<rect x="1590" y="700" width="100" height="120" rx="11" fill="#e9f5f1" stroke="#219487" class="card"/><text x="1640" y="742" text-anchor="middle" class="h">Policy</text><text x="1640" y="774" text-anchor="middle" class="small">registry</text><text x="1640" y="798" text-anchor="middle" class="small">v + audit</text>
<path d="M365 760H445" class="evidence"/><polygon points="445,760 436,755.5 436,764.5" fill="#219487"/><path d="M690 760H770" class="flow"/><polygon points="770,760 761,755.5 761,764.5" fill="#23364d"/><path d="M1015 760H1095" class="update"/><polygon points="1095,760 1086,755.5 1086,764.5" fill="#735fbd"/><path d="M1340 760H1375" class="update"/><polygon points="1375,760 1366,755.5 1366,764.5" fill="#735fbd"/><path d="M1545 760H1590" class="update"/><polygon points="1590,760 1581,755.5 1581,764.5" fill="#735fbd"/>
<text x="1570" y="744" text-anchor="end" class="tiny">yes</text>
<rect x="1375" y="875" width="170" height="70" rx="10" fill="#fff" stroke="#c65b5b" stroke-width="2.5"/><text x="1460" y="906" text-anchor="middle" class="h">Reject / retain</text><text x="1460" y="929" text-anchor="middle" class="small">current policy</text><path d="M1460 830V875" class="flow"/><polygon points="1460,875 1455.5,866 1464.5,866" fill="#23364d"/><text x="1475" y="858" class="tiny">no</text>

<!-- controlled feedback to live system -->
<path d="M1640 700V535H545V400" class="update"/><polygon points="545,400 540.5,409 549.5,409" fill="#735fbd"/><text x="950" y="528" text-anchor="middle" class="small">approved version enters the next run; the external task interface remains stable</text>
<path d="M1535 400V650H242V700" class="evidence"/><polygon points="242,700 237.5,691 246.5,691" fill="#219487"/><text x="955" y="642" text-anchor="middle" class="tiny">sample traces, not unverified model intuition</text>
<rect x="390" y="1030" width="1020" height="55" rx="9" class="note"/><text x="900" y="1065" text-anchor="middle" class="s">Adaptation contract: versioned artifact · fixed evaluation set · rollback path · scope of change · human approval when impact is high</text>
</svg>
