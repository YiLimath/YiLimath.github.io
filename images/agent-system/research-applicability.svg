<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Theorem retrieval ends with an applicability test</title><desc id="d">The extreme value theorem requires compactness. The open interval does not meet that requirement.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42647c"/></marker></defs><rect width="1000" height="620" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16334a"><text x="30" y="42" font-size="26" font-weight="bold">Theorem retrieval ends with an applicability test</text><rect x="30" y="85" width="440" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="46" y="115" font-size="20">Retrieved theorem</text><text x="46" y="142" font-size="16">A continuous real-valued function on a</text><text x="46" y="167" font-size="16">nonempty compact space attains a maximum.</text><rect x="530" y="85" width="440" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="546" y="115" font-size="20">Current target</text><text x="546" y="142" font-size="16">Every continuous real-valued function on</text><text x="546" y="167" font-size="16">the open interval (0,1) attains a maximum.</text><text x="45" y="255" font-size="20">Source requirement</text><text x="365" y="255" font-size="20">Current evidence</text><text x="760" y="255" font-size="20">Outcome</text><path d="M30 323H970" stroke="#d3dce4"/><text x="45" y="305" font-size="17">Real-valued function</text><text x="365" y="305" font-size="17">Declared in target</text><text x="760" y="305" font-size="17">Matched</text><path d="M30 378H970" stroke="#d3dce4"/><text x="45" y="360" font-size="17">Continuity</text><text x="365" y="360" font-size="17">Assumed in target</text><text x="760" y="360" font-size="17">Matched</text><path d="M30 433H970" stroke="#d3dce4"/><text x="45" y="415" font-size="17">Nonempty compact domain</text><text x="365" y="415" font-size="17">(0,1): not compact</text><text x="760" y="415" font-size="17">Blocked</text><path d="M830 440V490" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="650" y="475" font-size="15">missing premise</text><rect x="530" y="490" width="440" height="105" rx="8" fill="#fff4e6" stroke="#698496"/><text x="546" y="520" font-size="20">Next action</text><text x="546" y="547" font-size="16">Find another argument or test a counterexample.</text><text x="546" y="572" font-size="16">Do not silently replace the domain by [0,1].</text></g></svg>