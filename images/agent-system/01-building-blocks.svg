<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.t{font:600 18px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Agent System: Building Blocks</text><text x="80" y="110" class="sub">Keep interfaces small; compose modules around a stable contract</text><text x="800" y="170" text-anchor="middle" class="h">stable orchestration interface</text><rect x="300" y="205" width="1000" height="95" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="800" y="245" text-anchor="middle" class="h">Orchestration</text><text x="800" y="276" text-anchor="middle" class="s">input → context → model → output</text><path d="M800 300 V350" class="l"/><polygon points="800,350 795.5,341 804.5,341" class="al"/><rect x="120" y="380" width="250" height="150" rx="10" class="b"/><text x="245" y="425" text-anchor="middle" class="h">Model</text><text x="245" y="460" text-anchor="middle" class="s">reasoning capacity</text><text x="245" y="492" text-anchor="middle" class="s">generation / scoring</text><rect x="445" y="380" width="250" height="150" rx="10" class="b"/><text x="570" y="425" text-anchor="middle" class="h">Prompt</text><text x="570" y="460" text-anchor="middle" class="s">instructions</text><text x="570" y="492" text-anchor="middle" class="s">role / format / constraints</text><rect x="770" y="380" width="250" height="150" rx="10" class="b"/><text x="895" y="425" text-anchor="middle" class="h">Context</text><text x="895" y="460" text-anchor="middle" class="s">task state</text><text x="895" y="492" text-anchor="middle" class="s">retrieved information</text><rect x="1095" y="380" width="250" height="150" rx="10" class="b"/><text x="1220" y="425" text-anchor="middle" class="h">Evaluation</text><text x="1220" y="460" text-anchor="middle" class="s">tests</text><text x="1220" y="492" text-anchor="middle" class="s">feedback / guardrails</text><path d="M245 380 V340 H800" class="l"/><polygon points="800,340 791,335.5 791,344.5" class="al"/><path d="M570 380 V340" class="l"/><polygon points="570,340 565.5,349 574.5,349" class="al"/><path d="M895 380 V340" class="l"/><polygon points="895,340 890.5,349 899.5,349" class="al"/><path d="M1220 380 V340 H800" class="l"/><polygon points="800,340 809,335.5 809,344.5" class="al"/><rect x="280" y="610" width="1040" height="105" rx="10" fill="#eef5ff" stroke="#3985c6" stroke-width="2"/><text x="800" y="652" text-anchor="middle" class="h">External capabilities</text><text x="800" y="686" text-anchor="middle" class="s">tools · memory · human approval · domain services</text><path d="M800 610 V530" class="l"/><polygon points="800,530 795.5,539 804.5,539" class="al"/><text x="800" y="795" text-anchor="middle" class="s">The pattern is not a single model. It is the boundary that makes the parts replaceable.</text></svg>
