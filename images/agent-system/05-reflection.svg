<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#7355aa;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Reflection Pattern</text><text x="80" y="110" class="sub">Separate generation from critique; use evaluation to drive a controlled revision loop</text><rect x="120" y="360" width="220" height="110" rx="10" class="b"/><text x="230" y="405" text-anchor="middle" class="h">Task</text><text x="230" y="436" text-anchor="middle" class="s">requirements</text><path d="M340 415 H505" class="l"/><rect x="505" y="360" width="250" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="630" y="405" text-anchor="middle" class="h">Generate</text><text x="630" y="436" text-anchor="middle" class="s">draft result</text><path d="M755 415 H920" class="l"/><rect x="920" y="360" width="250" height="110" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="1045" y="405" text-anchor="middle" class="h">Critique</text><text x="1045" y="436" text-anchor="middle" class="s">check against criteria</text><path d="M1170 415 H1340" class="l"/><rect x="1340" y="360" width="180" height="110" rx="10" class="b"/><text x="1430" y="405" text-anchor="middle" class="h">Accept?</text><text x="1430" y="436" text-anchor="middle" class="s">yes / no</text><path d="M1430 470 V625 H630 V470" class="d"/><text x="1030" y="615" text-anchor="middle" class="s">no: revise with critique</text><path d="M1430 360 V245 H1435" class="l"/><rect x="1290" y="175" width="270" height="70" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="2"/><text x="1425" y="218" text-anchor="middle" class="h">Final result</text><rect x="310" y="745" width="980" height="60" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="783" text-anchor="middle" class="s">The evaluator is an explicit component, not an implicit feeling of quality.</text></svg>
