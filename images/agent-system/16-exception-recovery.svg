<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Exception Handling and Recovery</text><text x="80" y="110" class="u">Treat failure as an explicit state with a bounded recovery policy</text><rect x="110" y="365" width="220" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="220" y="408" text-anchor="middle" class="h">Agent step</text><text x="220" y="438" text-anchor="middle" class="s">action or tool call</text><path d="M330 417H500" class="l"/><polygon points="500,417 491,412.5 491,421.5" class="al"/><rect x="500" y="365" width="240" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="620" y="408" text-anchor="middle" class="h">Success</text><text x="620" y="438" text-anchor="middle" class="s">validate observation</text><path d="M740 417H910" class="l"/><polygon points="910,417 901,412.5 901,421.5" class="al"/><rect x="910" y="365" width="240" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="1030" y="408" text-anchor="middle" class="h">Continue</text><text x="1030" y="438" text-anchor="middle" class="s">next controlled step</text><path d="M620 365V235H810" class="r"/><polygon points="810,235 801,230.5 801,239.5" class="ar"/><rect x="810" y="180" width="270" height="110" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="945" y="223" text-anchor="middle" class="h">Failure state</text><text x="945" y="253" text-anchor="middle" class="s">classify · preserve evidence</text><path d="M1080 235H1240" class="r"/><polygon points="1240,235 1231,230.5 1231,239.5" class="ar"/><rect x="1240" y="180" width="250" height="110" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1365" y="223" text-anchor="middle" class="h">Recovery policy</text><text x="1365" y="253" text-anchor="middle" class="s">retry · repair · fallback</text><path d="M1365 290V630H620V470" class="d"/><polygon points="620,470 615.5,479 624.5,479" class="ad"/><path d="M945 290V630" class="r"/><polygon points="945,630 940.5,621 949.5,621" class="ar"/><rect x="810" y="610" width="270" height="95" rx="10" fill="#fff" stroke="#9eb0c2" class="b"/><text x="945" y="650" text-anchor="middle" class="h">Escalate</text><text x="945" y="680" text-anchor="middle" class="s">human or safe stop</text><text x="800" y="765" text-anchor="middle" class="s">Recovery must be bounded: retry limits, idempotence, checkpoints, and a visible terminal state.</text><rect x="390" y="795" width="820" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="824" text-anchor="middle" class="s">Do not turn an unclassified failure into a confident answer.</text></svg>
