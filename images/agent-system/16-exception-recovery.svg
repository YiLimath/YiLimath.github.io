<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;marker-end:url(#r-arrow);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Exception Handling and Recovery</text><text x="80" y="110" class="u">Treat failure as an explicit state with a bounded recovery policy</text><rect x="110" y="365" width="220" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="220" y="408" text-anchor="middle" class="h">Agent step</text><text x="220" y="438" text-anchor="middle" class="s">action or tool call</text><path d="M330 417H500" class="l"/><rect x="500" y="365" width="240" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="620" y="408" text-anchor="middle" class="h">Success</text><text x="620" y="438" text-anchor="middle" class="s">validate observation</text><path d="M740 417H910" class="l"/><rect x="910" y="365" width="240" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="1030" y="408" text-anchor="middle" class="h">Continue</text><text x="1030" y="438" text-anchor="middle" class="s">next controlled step</text><path d="M620 365V235H810" class="r"/><rect x="810" y="180" width="270" height="110" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="945" y="223" text-anchor="middle" class="h">Failure state</text><text x="945" y="253" text-anchor="middle" class="s">classify · preserve evidence</text><path d="M1080 235H1240" class="r"/><rect x="1240" y="180" width="250" height="110" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1365" y="223" text-anchor="middle" class="h">Recovery policy</text><text x="1365" y="253" text-anchor="middle" class="s">retry · repair · fallback</text><path d="M1365 290V630H620V470" class="d"/><path d="M945 290V630" class="r"/><rect x="810" y="610" width="270" height="95" rx="10" fill="#fff" stroke="#9eb0c2" class="b"/><text x="945" y="650" text-anchor="middle" class="h">Escalate</text><text x="945" y="680" text-anchor="middle" class="s">human or safe stop</text><text x="800" y="765" text-anchor="middle" class="s">Recovery must be bounded: retry limits, idempotence, checkpoints, and a visible terminal state.</text><rect x="390" y="795" width="820" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="824" text-anchor="middle" class="s">Do not turn an unclassified failure into a confident answer.</text></svg>
