<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Research claim admission</title><desc id="desc">Candidate arguments undergo review. Policy admits reviewed claims or returns unresolved obligations for revision. Changed premises suspend dependent uses.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526579"/></marker></defs><rect width="1000" height="430" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="30" y="40" font-size="24" fill="#162d45">Mathematical claims: evidence before admission</text><rect x="30" y="90" width="280" height="90" rx="8" fill="white" stroke="#56718b"/><text x="46" y="122" font-size="20" fill="#162d45">Candidate</text><text x="46" y="150" font-size="15" fill="#43566a">Frozen statement + argument</text><rect x="350" y="90" width="280" height="90" rx="8" fill="white" stroke="#56718b"/><text x="366" y="122" font-size="20" fill="#162d45">Evidence review</text><text x="366" y="150" font-size="15" fill="#43566a">Hypotheses + dependencies</text><rect x="670" y="90" width="280" height="90" rx="8" fill="white" stroke="#56718b"/><text x="686" y="122" font-size="20" fill="#162d45">Admission policy</text><text x="686" y="150" font-size="15" fill="#43566a">Permission + evidence status</text><rect x="670" y="280" width="280" height="90" rx="8" fill="white" stroke="#56718b"/><text x="686" y="312" font-size="20" fill="#162d45">Premise ledger</text><text x="686" y="340" font-size="15" fill="#43566a">Versioned, auditable claims</text><rect x="350" y="280" width="280" height="90" rx="8" fill="white" stroke="#56718b"/><text x="366" y="312" font-size="20" fill="#162d45">Open obligations</text><text x="366" y="340" font-size="15" fill="#43566a">Gap / source question / repair</text><rect x="30" y="280" width="280" height="90" rx="8" fill="white" stroke="#56718b"/><text x="46" y="312" font-size="20" fill="#162d45">Revision</text><text x="46" y="340" font-size="15" fill="#43566a">New version; repeat review</text><path d="M310 135H350" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="14" fill="#43566a"></text><path d="M630 135H670" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="14" fill="#43566a"></text><path d="M810 180V280" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><text x="825" y="235" font-size="14" fill="#43566a">admit</text><path d="M750 180V225H490V280" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="213" font-size="14" fill="#43566a">unresolved / rejected</text><path d="M350 325H310" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="14" fill="#43566a"></text><path d="M170 280V180" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><text x="185" y="235" font-size="14" fill="#43566a">revise</text><text x="30" y="410" font-size="16" fill="#43566a">Changed premise → suspend dependent uses → recheck affected arguments.</text></g></svg>