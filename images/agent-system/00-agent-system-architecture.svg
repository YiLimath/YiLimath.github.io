<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.ar{fill:#c65b5b;stroke:none}.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 21px Arial;fill:#17283c}.s{font:400 15px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Agent System: Reference Architecture</text><text x="80" y="110" class="u">A general architecture for composing design patterns around a controlled agent loop</text><rect x="95" y="350" width="220" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="205" y="394" text-anchor="middle" class="h">User / goal</text><text x="205" y="425" text-anchor="middle" class="s">request · constraints</text><path d="M315 405H440" class="l"/><polygon points="440,405 431,400.5 431,409.5" class="al"/><rect x="440" y="300" width="300" height="210" rx="12" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="590" y="350" text-anchor="middle" class="h">Orchestration layer</text><text x="590" y="390" text-anchor="middle" class="s">workflow · router · planner</text><text x="590" y="425" text-anchor="middle" class="s">state · termination · recovery</text><text x="590" y="460" text-anchor="middle" class="s">human delegation</text><path d="M740 405H850" class="l"/><polygon points="850,405 841,400.5 841,409.5" class="al"/><rect x="850" y="180" width="270" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="985" y="222" text-anchor="middle" class="h">Reasoning layer</text><text x="985" y="253" text-anchor="middle" class="s">reflection · search · planning</text><rect x="850" y="350" width="270" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="985" y="392" text-anchor="middle" class="h">Knowledge layer</text><text x="985" y="423" text-anchor="middle" class="s">retrieval · memory · context</text><rect x="850" y="520" width="270" height="105" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="985" y="562" text-anchor="middle" class="h">Action layer</text><text x="985" y="593" text-anchor="middle" class="s">tools · code · communication</text><path d="M740 405H800V232H840" class="l"/><polygon points="840,232 831,227.5 831,236.5" class="al"/><path d="M740 405H840" class="l"/><polygon points="840,405 831,400.5 831,409.5" class="al"/><path d="M740 405H800V572H840" class="l"/><polygon points="840,572 831,567.5 831,576.5" class="al"/><path d="M1120 232H1250V690H205V460" class="d"/><polygon points="205,460 200.5,469 209.5,469" class="ad"/><path d="M1120 402H1250" class="d"/><polygon points="1250,402 1241,397.5 1241,406.5" class="ad"/><path d="M1120 572H1250" class="d"/><polygon points="1250,572 1241,567.5 1241,576.5" class="ad"/><rect x="420" y="650" width="320" height="95" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="580" y="690" text-anchor="middle" class="h">Evaluation &amp; guardrails</text><text x="580" y="721" text-anchor="middle" class="s">tests · policy · observability</text><path d="M580 650V510" class="r"/><polygon points="580,510 575.5,519 584.5,519" class="ar"/><text x="800" y="780" text-anchor="middle" class="s">The stable interfaces are artifacts, messages, tools, state, and evaluation—not a particular model.</text><rect x="350" y="810" width="900" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="839" text-anchor="middle" class="s">Pattern choice controls where flexibility is allowed and where behavior must be testable.</text></svg>
