<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Agent System — System Context</title>
<desc id="figure-desc">A context view showing an agent system and its relationships with an operator, external services, knowledge sources, and a human reviewer.</desc>
<defs>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#17283c}
    .subtitle{font:400 18px Arial,sans-serif;fill:#5b6b7c}
    .heading{font:700 21px Arial,sans-serif;fill:#17283c}
    .body{font:400 15px Arial,sans-serif;fill:#405268}
    .small{font:400 13px Arial,sans-serif;fill:#5b6b7c}
    .scope{fill:#fbfcfe;stroke:#8595a8;stroke-width:2.5;stroke-dasharray:9 8}
    .person{fill:#e6f1fb;stroke:#3985c6;stroke-width:3}
    .system{fill:#e9f5f1;stroke:#219487;stroke-width:3}
    .external{fill:#f0ebfb;stroke:#7863b6;stroke-width:3}
    .review{fill:#fff4e8;stroke:#d98c2b;stroke-width:3}
    .relation{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:butt;stroke-linejoin:miter}
    .reply{stroke:#219487;stroke-width:3;stroke-dasharray:9 7;fill:none;stroke-linecap:butt;stroke-linejoin:miter}
    .escalation{stroke:#c65b5b;stroke-width:3;fill:none;stroke-linecap:butt;stroke-linejoin:miter}
    .arrow{fill:#23364d}
    .reply-arrow{fill:#219487}
    .escalation-arrow{fill:#c65b5b}
  </style>
</defs>

<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="80" y="72" class="title">Agent System — System Context</text>
<text x="80" y="106" class="subtitle">The system boundary and its external relationships; internal containers are intentionally hidden</text>

<rect x="400" y="155" width="780" height="565" rx="16" class="scope"/>
<text x="430" y="190" class="small">SYSTEM CONTEXT · SCOPE: ONE AGENT SYSTEM</text>

<rect x="610" y="325" width="360" height="155" rx="12" class="system"/>
<text x="790" y="375" text-anchor="middle" class="heading">Agent system</text>
<text x="790" y="408" text-anchor="middle" class="body">turn a goal into a checked outcome</text>
<text x="790" y="439" text-anchor="middle" class="small">orchestrates reasoning, knowledge, action, and review</text>

<rect x="80" y="335" width="240" height="120" rx="12" class="person"/>
<text x="200" y="380" text-anchor="middle" class="heading">Operator</text>
<text x="200" y="412" text-anchor="middle" class="body">goal · constraints</text>
<text x="200" y="436" text-anchor="middle" class="small">starts, observes, or stops work</text>

<rect x="1220" y="180" width="270" height="112" rx="12" class="external"/>
<text x="1355" y="224" text-anchor="middle" class="heading">External services</text>
<text x="1355" y="256" text-anchor="middle" class="body">models · APIs · execution</text>

<rect x="1220" y="355" width="270" height="112" rx="12" class="external"/>
<text x="1355" y="399" text-anchor="middle" class="heading">Knowledge sources</text>
<text x="1355" y="431" text-anchor="middle" class="body">documents · databases · records</text>

<rect x="1220" y="540" width="270" height="112" rx="12" class="review"/>
<text x="1355" y="584" text-anchor="middle" class="heading">Human reviewer</text>
<text x="1355" y="616" text-anchor="middle" class="body">approval · correction · escalation</text>

<path d="M320 380H598" class="relation"/>
<polygon points="610,380 598,374 598,386" class="arrow"/>
<text x="456" y="365" text-anchor="middle" class="small">request</text>

<path d="M598 435H332" class="reply"/>
<polygon points="320,435 332,429 332,441" class="reply-arrow"/>
<text x="460" y="455" text-anchor="middle" class="small">outcome / progress</text>

<path d="M970 350H1090V236H1208" class="relation"/>
<polygon points="1220,236 1208,230 1208,242" class="arrow"/>
<text x="1088" y="220" text-anchor="middle" class="small">tool or model call</text>

<path d="M1208 276H1110V410H982" class="reply"/>
<polygon points="970,410 982,404 982,416" class="reply-arrow"/>
<text x="1095" y="430" text-anchor="middle" class="small">observation / result</text>

<path d="M970 400H1208" class="relation"/>
<polygon points="1220,400 1208,394 1208,406" class="arrow"/>
<text x="1090" y="385" text-anchor="middle" class="small">query / retrieval</text>

<path d="M1208 450H1110V455H982" class="reply"/>
<polygon points="970,455 982,449 982,461" class="reply-arrow"/>
<text x="1095" y="475" text-anchor="middle" class="small">evidence / context</text>

<path d="M970 445H1080V580H1208" class="escalation"/>
<polygon points="1220,580 1208,574 1208,586" class="escalation-arrow"/>
<text x="1082" y="563" text-anchor="middle" class="small">escalate</text>

<path d="M1208 620H1125V495H982" class="reply"/>
<polygon points="970,495 982,489 982,501" class="reply-arrow"/>
<text x="1100" y="512" text-anchor="middle" class="small">decision / feedback</text>

<rect x="430" y="760" width="740" height="72" rx="10" fill="#ffffff" stroke="#c4ced8" stroke-width="2"/>
<text x="455" y="789" class="small">NOTATION</text>
<line x1="545" y1="785" x2="600" y2="785" class="relation"/>
<polygon points="610,785 600,780 600,790" class="arrow"/>
<text x="625" y="790" class="small">request or command</text>
<line x1="790" y1="785" x2="845" y2="785" class="reply"/>
<polygon points="855,785 845,780 845,790" class="reply-arrow"/>
<text x="870" y="790" class="small">response or evidence</text>
<line x1="545" y1="815" x2="600" y2="815" class="escalation"/>
<polygon points="610,815 600,810 600,820" class="escalation-arrow"/>
<text x="625" y="820" class="small">human escalation</text>
<text x="870" y="820" class="small">The context view says who exchanges responsibility with the system.</text>
</svg>
