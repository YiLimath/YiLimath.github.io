<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#23364d"/></marker><marker id="d-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#219487"/></marker><marker id="r-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c65b5b"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 21px Arial;fill:#17283c}.s{font:400 15px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#d-arrow);stroke-linecap:round;stroke-linejoin:round}.r{stroke:#c65b5b;stroke-width:3;fill:none;marker-end:url(#r-arrow);stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Agent System: Reference Architecture</text><text x="80" y="110" class="u">A general architecture for composing design patterns around a controlled agent loop</text><rect x="95" y="350" width="220" height="110" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="205" y="394" text-anchor="middle" class="h">User / goal</text><text x="205" y="425" text-anchor="middle" class="s">request · constraints</text><path d="M315 405H440" class="l"/><rect x="440" y="300" width="300" height="210" rx="12" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="590" y="350" text-anchor="middle" class="h">Orchestration layer</text><text x="590" y="390" text-anchor="middle" class="s">workflow · router · planner</text><text x="590" y="425" text-anchor="middle" class="s">state · termination · recovery</text><text x="590" y="460" text-anchor="middle" class="s">human delegation</text><path d="M740 405H850" class="l"/><rect x="850" y="180" width="270" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="985" y="222" text-anchor="middle" class="h">Reasoning layer</text><text x="985" y="253" text-anchor="middle" class="s">reflection · search · planning</text><rect x="850" y="350" width="270" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="985" y="392" text-anchor="middle" class="h">Knowledge layer</text><text x="985" y="423" text-anchor="middle" class="s">retrieval · memory · context</text><rect x="850" y="520" width="270" height="105" rx="10" fill="#fff" stroke="#3985c6" class="b"/><text x="985" y="562" text-anchor="middle" class="h">Action layer</text><text x="985" y="593" text-anchor="middle" class="s">tools · code · communication</text><path d="M740 405H800V232H840" class="l"/><path d="M740 405H840" class="l"/><path d="M740 405H800V572H840" class="l"/><path d="M1120 232H1250V690H205V460" class="d"/><path d="M1120 402H1250" class="d"/><path d="M1120 572H1250" class="d"/><rect x="420" y="650" width="320" height="95" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="580" y="690" text-anchor="middle" class="h">Evaluation &amp; guardrails</text><text x="580" y="721" text-anchor="middle" class="s">tests · policy · observability</text><path d="M580 650V510" class="r"/><text x="800" y="780" text-anchor="middle" class="s">The stable interfaces are artifacts, messages, tools, state, and evaluation—not a particular model.</text><rect x="350" y="810" width="900" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="839" text-anchor="middle" class="s">Pattern choice controls where flexibility is allowed and where behavior must be testable.</text></svg>
