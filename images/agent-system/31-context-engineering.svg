<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.al{fill:#23364d;stroke:none}.ad{fill:#219487;stroke:none}.title{font:700 34px Arial;fill:#17283c}.sub{font:400 18px Arial;fill:#5b6b7c}.h{font:700 22px Arial;fill:#17283c}.s{font:400 16px Arial;fill:#405268}.m{font:400 15px Arial;fill:#5b6b7c}.b{fill:#fff;stroke:#9eb0c2;stroke-width:2}.l{stroke:#23364d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.t{stroke:#9eb0c2;stroke-width:2;fill:none;stroke-linecap:round}.d{stroke:#7355aa;stroke-width:3;stroke-dasharray:10 8;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="title">Context Engineering</text><text x="80" y="110" class="sub">What enters this inference window, in what order, and what is dropped to stay inside the budget</text><text x="90" y="180" class="h">Candidate context</text><rect x="90" y="210" width="250" height="64" rx="10" class="b"/><text x="215" y="249" text-anchor="middle" class="s">System instructions</text><rect x="90" y="292" width="250" height="64" rx="10" class="b"/><text x="215" y="331" text-anchor="middle" class="s">Current task</text><rect x="90" y="374" width="250" height="64" rx="10" class="b"/><text x="215" y="413" text-anchor="middle" class="s">Conversation history</text><rect x="90" y="456" width="250" height="64" rx="10" class="b"/><text x="215" y="495" text-anchor="middle" class="s">Retrieved knowledge</text><rect x="90" y="538" width="250" height="64" rx="10" class="b"/><text x="215" y="577" text-anchor="middle" class="s">Tool results</text><path d="M340 242 H405" class="t"/><path d="M340 324 H405" class="t"/><path d="M340 406 H405" class="t"/><path d="M340 488 H405" class="t"/><path d="M340 570 H405" class="t"/><path d="M405 242 V570" class="t"/><path d="M405 440 H470" class="l"/><polygon points="470,440 461,435.5 461,444.5" class="al"/><rect x="470" y="300" width="250" height="280" rx="10" fill="#e6f1fb" stroke="#3985c6" stroke-width="3"/><text x="595" y="345" text-anchor="middle" class="h">Assembler</text><text x="595" y="395" text-anchor="middle" class="s">prioritize</text><text x="595" y="435" text-anchor="middle" class="s">compact (head + tail)</text><text x="595" y="475" text-anchor="middle" class="s">isolate (sub-agent)</text><text x="595" y="515" text-anchor="middle" class="s">filter tool results</text><text x="595" y="558" text-anchor="middle" class="m">policy, not accident</text><path d="M720 440 H820" class="l"/><polygon points="820,440 811,435.5 811,444.5" class="al"/><rect x="820" y="340" width="230" height="200" rx="10" fill="#fff4e8" stroke="#d98c2b" stroke-width="3"/><text x="935" y="415" text-anchor="middle" class="h">Bounded window</text><text x="935" y="452" text-anchor="middle" class="s">fixed token budget</text><text x="935" y="486" text-anchor="middle" class="m">attention is scarce</text><path d="M1050 440 H1150" class="l"/><polygon points="1150,440 1141,435.5 1141,444.5" class="al"/><rect x="1150" y="380" width="200" height="120" rx="10" fill="#e6f4f1" stroke="#219487" stroke-width="3"/><text x="1250" y="448" text-anchor="middle" class="h">Model call</text><path d="M1250 500 V660 H215 V606" class="d"/><polygon points="215,606 210.5,615 219.5,615" class="ad"/><text x="740" y="690" text-anchor="middle" class="s">every step appends new results: context grows without a policy to shrink it</text><rect x="230" y="762" width="1140" height="60" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="800" text-anchor="middle" class="s">One research task, three designs: 21,633 tokens unmanaged, 7,276 with compaction, 5,892 with isolation.</text></svg>
