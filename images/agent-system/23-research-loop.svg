<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#23364d"/></marker><style>.t{font:700 34px Arial;fill:#17283c}.u{font:400 18px Arial;fill:#5b6b7c}.h{font:700 21px Arial;fill:#17283c}.s{font:400 15px Arial;fill:#405268}.b{stroke-width:3}.l{stroke:#23364d;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#219487;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#a)}.r{stroke:#c65b5b;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><text x="80" y="75" class="t">Rethlas / Danus: Verified-Proof Loop</text><text x="80" y="110" class="u">A worker proposes; a fresh verifier decides; rejection becomes repair information</text><rect x="100" y="360" width="230" height="105" rx="10" fill="#e6f1fb" stroke="#3985c6" class="b"/><text x="215" y="402" text-anchor="middle" class="h">Problem file</text><text x="215" y="432" text-anchor="middle" class="s">statement + references</text><path d="M330 412H475" class="l"/><rect x="475" y="360" width="245" height="105" rx="10" fill="#fff4e8" stroke="#d98c2b" class="b"/><text x="597" y="402" text-anchor="middle" class="h">Generation agent</text><text x="597" y="432" text-anchor="middle" class="s">search · memory · branch</text><path d="M720 412H855" class="l"/><rect x="855" y="360" width="250" height="105" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="980" y="402" text-anchor="middle" class="h">Proof blueprint</text><text x="980" y="432" text-anchor="middle" class="s">statement + proof markdown</text><path d="M1105 412H1240" class="l"/><rect x="1240" y="360" width="250" height="105" rx="10" fill="#f0ebfb" stroke="#7863b6" class="b"/><text x="1365" y="402" text-anchor="middle" class="h">Verifier service</text><text x="1365" y="432" text-anchor="middle" class="s">fresh Codex judge</text><path d="M1365 465V610H1110" class="l"/><rect x="855" y="610" width="255" height="100" rx="10" fill="#e9f5f1" stroke="#219487" class="b"/><text x="982" y="650" text-anchor="middle" class="h">Correct verdict</text><text x="982" y="680" text-anchor="middle" class="s">write verified result</text><path d="M1365 465V525H700V610" class="r"/><rect x="445" y="610" width="255" height="100" rx="10" fill="#fceceb" stroke="#c65b5b" class="b"/><text x="572" y="650" text-anchor="middle" class="h">Reject + repair hints</text><text x="572" y="680" text-anchor="middle" class="s">preserve report · revise</text><path d="M445 660H250V412H465" class="r"/><path d="M1110 660H1260V760H215V465" class="d"/><text x="800" y="770" text-anchor="middle" class="s">Rethlas uses two agents; Danus repeats the loop across workers and adds a verifier-gated fact graph.</text><rect x="360" y="805" width="880" height="45" rx="8" fill="#fff" stroke="#c4ced8" stroke-width="2"/><text x="800" y="834" text-anchor="middle" class="s">The terminal artifact is blueprint_verified.md, not merely a fluent draft.</text></svg>
