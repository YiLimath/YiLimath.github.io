<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">08 / Merge evidence about the same target</title><desc id="desc">Task outputs are submissions to inspect, not automatically accepted premises.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#357477"/></marker></defs><rect width="1120" height="680" rx="20" fill="#f4f7fa"/>
<text x="40" y="49" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#19364b">08 / Merge evidence about the same target</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Task outputs are submissions to inspect, not automatically accepted premises.</text>
<rect x="40" y="255" width="260" height="145" rx="12" fill="#e9eef9" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="286" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Shared target T1-v1</text>
<text x="58" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Allowed inputs: real numbers</text>
<text x="58" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Output rule: r(c) = (c,c)</text>
<text x="58" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Requested output: (1,0)</text>
<rect x="400" y="125" width="280" height="110" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="418" y="156" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Source-audit task</text>
<text x="418" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Allowed inputs and theorem</text>
<text x="418" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Hypotheses plus source evidence</text>
<rect x="400" y="425" width="280" height="110" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="418" y="456" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Direct-calculation task</text>
<text x="418" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Compute possible outputs</text>
<text x="418" y="510" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Test the requested pair</text>
<rect x="790" y="255" width="290" height="145" rx="12" fill="#e7f2f2" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="808" y="286" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Mathematical merge</text>
<text x="808" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Check target and assumptions</text>
<text x="808" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Inspect each argument</text>
<text x="808" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Retain support; localize conflicts</text>
<polyline points="300,300 350,300 350,180 400,180" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="300,355 350,355 350,480 400,480" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="680,180 735,180 735,300 790,300" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="690" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">report</text>
<polyline points="680,480 735,480 735,355 790,355" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="690" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">report</text>
<text x="800" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#19364b">Outcome: (1,0) cannot</text>
<text x="800" y="472" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#19364b">be produced by this rule.</text>
<path d="M40 596 H1080" stroke="#cbd8df"/>
<text x="40" y="624" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#19364b">Delayed report: an input producing (1,1) is a different conclusion, not a contradictory vote.</text>
<text x="40" y="652" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#19364b">Reuse its general calculation only after checking applicability to the current target.</text>
</svg>