<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">06 / What a checked declaration establishes</title><desc id="desc">Formal evidence and alignment with the intended mathematics are separate inputs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#357477"/></marker></defs><rect width="1120" height="680" rx="20" fill="#f4f7fa"/>
<text x="40" y="49" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#19364b">06 / What a checked declaration establishes</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Formal evidence and alignment with the intended mathematics are separate inputs.</text>
<rect x="40" y="135" width="290" height="115" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Intended proposition</text>
<text x="58" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Original domain and quantifiers</text>
<text x="58" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Assumptions and conclusion</text>
<rect x="415" y="135" width="290" height="115" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="433" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Encoded declaration</text>
<text x="433" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Read its actual Lean type</text>
<text x="433" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Compare definitions and scope</text>
<rect x="790" y="135" width="290" height="115" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="808" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Execution evidence</text>
<text x="808" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Pinned toolchain and dependencies</text>
<text x="808" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Actual output, not proposed code</text>
<polyline points="330,192 415,192" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="347" y="177" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">encode</text>
<polyline points="705,192 790,192" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="727" y="177" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#32696d">check</text>
<rect x="40" y="365" width="290" height="140" rx="12" fill="#e9eef9" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="58" y="396" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Semantic alignment</text>
<text x="58" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Does the type express the target?</text>
<text x="58" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Pointwise is not uniform</text>
<text x="58" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Correct proof of wrong task fails</text>
<rect x="415" y="365" width="290" height="140" rx="12" fill="#e7f2f2" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="433" y="396" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Scoped admission</text>
<text x="433" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Alignment AND formal evidence</text>
<text x="433" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Policy on allowed dependencies</text>
<text x="433" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Exact declaration and environment</text>
<rect x="790" y="365" width="290" height="140" rx="12" fill="#ffffff" stroke="#b8ccd5" stroke-width="1.5"/>
<text x="808" y="396" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#19364b">Dependency audit</text>
<text x="808" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Inspect warnings and axioms</text>
<text x="808" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Reject remaining placeholders</text>
<text x="808" y="475" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#19364b">Check unexpected assumptions</text>
<polyline points="185,250 185,365" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="560,250 560,300 185,300" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="935,250 935,365" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="790,435 705,435" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="330,435 415,435" fill="none" stroke="#357477" stroke-width="2.3" marker-end="url(#arrow)"/>
<path d="M40 596 H1080" stroke="#cbd8df"/>
<text x="40" y="624" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#19364b">An exit code of zero alone does not discharge this admission policy.</text>
<text x="40" y="652" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#19364b">These teaching fixtures demonstrate the distinction; they are not a secure validation service.</text>
</svg>