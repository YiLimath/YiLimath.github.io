<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Two routes to lifting the chosen section</title><desc id="desc">With the exact sequence fixed, vanishing of the obstruction group implies zero obstruction, which is equivalent to lifting the chosen section. A direct obstruction calculation is an alternative route. Failure of group vanishing does not imply failure to lift.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#375a73"/></marker></defs><rect width="1100" height="650" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#18364b"><text x="35" y="45" font-size="27" font-weight="bold">Lift this section: sufficient route versus exact obstruction</text><rect x="35" y="80" width="1030" height="85" rx="8" fill="#e9f1f7" stroke="#7090a5"/><text x="55" y="112" font-size="20">Fixed setup: effective Cartier divisor S, invertible sheaf L, chosen section s</text><text x="55" y="142" font-size="18">The exact cohomology sequence identifies the image of restriction with the kernel of delta.</text><rect x="35" y="230" width="290" height="100" rx="8" fill="white" stroke="#7090a5"/><text x="52" y="263" font-size="20">Obstruction group vanishes</text><text x="52" y="297" font-size="18">H¹(X, L(-S)) = 0</text><rect x="405" y="230" width="290" height="100" rx="8" fill="white" stroke="#7090a5"/><text x="425" y="263" font-size="20">This obstruction vanishes</text><text x="425" y="297" font-size="18">delta(s) = 0</text><rect x="775" y="230" width="290" height="100" rx="8" fill="#e8f5ef" stroke="#7090a5"/><text x="795" y="263" font-size="20">The chosen section lifts</text><text x="795" y="297" font-size="18">A lift restricts to this s</text><path d="M325 280H405" stroke="#375a73" stroke-width="2" marker-end="url(#a)"/><text x="338" y="260" font-size="15">implies</text><path d="M695 280H775" stroke="#375a73" stroke-width="2" marker-end="url(#a)"/><path d="M775 310H695" stroke="#375a73" stroke-width="2" marker-end="url(#a)"/><text x="700" y="260" font-size="15">exactness</text><rect x="405" y="425" width="290" height="85" rx="8" fill="white" stroke="#7090a5"/><text x="425" y="457" font-size="20">Direct calculation of delta(s)</text><text x="425" y="486" font-size="17">An alternative source of evidence</text><path d="M550 425V330" stroke="#375a73" stroke-width="2" marker-end="url(#a)"/><text x="570" y="385" font-size="16">result: zero</text><text x="35" y="565" font-size="19">No reverse arrow on the left: a section can lift even when the obstruction group is nonzero.</text><text x="35" y="605" font-size="18">Failure to prove the sufficient vanishing condition leaves the direct route open.</text></g></svg>