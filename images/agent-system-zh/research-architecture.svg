<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Research responsibilities and artifact contracts</title><desc id="d">Workers propose claims. Review supplies evidence. Admission grants premise permissions and the ledger preserves versions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#42647c"/></marker></defs><rect width="1000" height="620" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#16334a"><text x="30" y="42" font-size="26" font-weight="bold">Research responsibilities and artifact contracts</text><rect x="30" y="100" width="270" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="46" y="130" font-size="20">Controller</text><text x="46" y="157" font-size="16">Target and budget</text><text x="46" y="182" font-size="16">Open-obligation queue</text><rect x="365" y="100" width="270" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="381" y="130" font-size="20">Worker</text><text x="381" y="157" font-size="16">Sources and tools</text><text x="381" y="182" font-size="16">Candidate argument</text><rect x="700" y="100" width="270" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="716" y="130" font-size="20">Reviewer</text><text x="716" y="157" font-size="16">Argument and premises</text><text x="716" y="182" font-size="16">Report + evidence kind</text><rect x="700" y="360" width="270" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="716" y="390" font-size="20">Admission</text><text x="716" y="417" font-size="16">Version and policy checks</text><text x="716" y="442" font-size="16">Grant or withhold use</text><rect x="365" y="360" width="270" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="381" y="390" font-size="20">Ledger</text><text x="381" y="417" font-size="16">Statements + inferences</text><text x="381" y="442" font-size="16">Versions + permissions</text><rect x="30" y="360" width="270" height="105" rx="8" fill="#ffffff" stroke="#698496"/><text x="46" y="390" font-size="20">Researcher interface</text><text x="46" y="417" font-size="16">Scope-change proposals</text><text x="46" y="442" font-size="16">Reports and decisions</text><path d="M300 150H365" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="310" y="135" font-size="15">task</text><path d="M635 150H700" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="643" y="135" font-size="15">draft</text><path d="M835 205V360" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="845" y="285" font-size="15">review report</text><path d="M700 410H635" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="649" y="395" font-size="15">write</text><path d="M365 410H300" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="310" y="395" font-size="15">report</text><path d="M165 360V205" fill="none" stroke="#42647c" stroke-width="2" marker-end="url(#a)"/><text x="175" y="285" font-size="15">policy</text><text x="30" y="550" font-size="17">A missing obligation returns to the queue; an admitted claim retains its evidence type.</text><text x="30" y="585" font-size="17">Responsibilities may share a process. Separate boxes do not require separate agents.</text></g></svg>