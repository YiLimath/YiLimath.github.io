<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Alternative proof routes and research actions</title><desc id="desc">The vanishing route requires the exact sequence and cohomology vanishing together. The direct route requires the exact sequence and a zero obstruction for the specified section. A research action only attempts to obtain missing evidence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#357477"/></marker></defs><rect width="1120" height="650" rx="18" fill="#f4f7fa"/><g font-family="Arial, sans-serif" fill="#19364b"><text x="36" y="46" font-size="27" fill="#19364b">02 / PROOF SUPPORT AND SEARCH</text><text x="36" y="79" font-size="18" fill="#19364b">Joint premises within a route. Alternative arguments for one fixed target.</text><rect x="40" y="130" width="340" height="130" rx="10" fill="#ffffff" stroke="#9badbb"/><text x="58" y="163" font-size="22" fill="#19364b">Route A: joint premises</text><text x="58" y="195" font-size="17" fill="#19364b">Correct restriction sequence</text><text x="58" y="220" font-size="17" fill="#19364b">Vanishing of H¹(X, L(-D))</text><rect x="40" y="330" width="340" height="130" rx="10" fill="#ffffff" stroke="#9badbb"/><text x="58" y="363" font-size="22" fill="#19364b">Route B: joint premises</text><text x="58" y="395" font-size="17" fill="#19364b">Correct restriction sequence</text><text x="58" y="420" font-size="17" fill="#19364b">Obstruction of the chosen s is zero</text><rect x="465" y="135" width="255" height="120" rx="10" fill="#e7f2ee" stroke="#9badbb"/><text x="483" y="168" font-size="22" fill="#19364b">Vanishing argument</text><text x="483" y="200" font-size="17" fill="#19364b">All obstructions are zero.</text><text x="483" y="225" font-size="17" fill="#19364b">Hence this s lifts.</text><rect x="465" y="335" width="255" height="120" rx="10" fill="#e7f2ee" stroke="#9badbb"/><text x="483" y="368" font-size="22" fill="#19364b">Direct argument</text><text x="483" y="400" font-size="17" fill="#19364b">Exactness identifies</text><text x="483" y="425" font-size="17" fill="#19364b">the image with the kernel.</text><path d="M380 195H465" fill="none" stroke="#357477" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M380 395H465" fill="none" stroke="#357477" stroke-width="2.4" marker-end="url(#arrow)"/><text x="397" y="176" font-size="16" fill="#19364b">AND</text><text x="397" y="376" font-size="16" fill="#19364b">AND</text><rect x="810" y="245" width="270" height="135" rx="10" fill="#ffffff" stroke="#9badbb"/><text x="828" y="278" font-size="22" fill="#19364b">Fixed target</text><text x="828" y="310" font-size="17" fill="#19364b">The specified section s</text><text x="828" y="335" font-size="17" fill="#19364b">lifts to the original space.</text><path d="M720 195H765V285H810" fill="none" stroke="#357477" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M720 395H765V345H810" fill="none" stroke="#357477" stroke-width="2.4" marker-end="url(#arrow)"/><text x="842" y="224" font-size="17" fill="#19364b">OR: either complete route</text><rect x="40" y="520" width="680" height="90" rx="10" fill="#edf0f7" stroke="#9badbb"/><text x="58" y="553" font-size="22" fill="#19364b">Next research action</text><text x="58" y="585" font-size="17" fill="#19364b">Check applicability or calculate the obstruction.</text><path d="M210 520V460" fill="none" stroke="#357477" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="755" y="552" font-size="17" fill="#19364b">Dashed: attempt to obtain evidence</text><text x="755" y="582" font-size="17" fill="#19364b">Solid: logical support</text></g></svg>